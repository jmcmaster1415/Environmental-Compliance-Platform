                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={() => setEditingId(p.id)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#6B7570' }}><Pencil size={14} /></button>
                  <button onClick={() => onRemove(p.id)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A' }}><Trash2 size={14} /></button>
                </div>
              </div>
              <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{
                  fontSize: 10.5, fontWeight: 600, color: '#fff', background: p.confirmedZero ? '#3F7D4F' : CONFIDENCE_COLORS[p.confidence] || '#8A8F8B',
                  borderRadius: 5, padding: '2px 7px',
                }}>
                  {p.confirmedZero ? 'Confirmed zero' : (CONFIDENCE_LABELS[p.confidence] || 'Unconfirmed')}
                </span>
              </div>
              {!p.confirmedZero && p.composition && p.composition.length > 0 && (
                <div style={{ marginTop: 8, fontSize: 12, color: '#3A4442' }}>
                  {p.composition.map((c) => c.name + ' ' + c.pct + '%').join(' · ')}
                </div>
              )}
              {p.notes && <div style={{ marginTop: 6, fontSize: 11.5, color: '#8A8F8B', fontStyle: 'italic' }}>{p.notes}</div>}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// Duplicate detection: part/mfr numbers in this facility's procurement data
// are NOT reliable for this -- the same number has shown up on genuinely
// different products (a vendor's internal control number, not a unique
// SKU). So the primary signal is name similarity: exact match after
// normalizing (punctuation/case/whitespace) is high confidence; a high
// token-overlap (Jaccard) score is a looser, "worth a look" signal. Shared
// part numbers are still surfaced, but only as a secondary hint, clearly
// labeled as unreliable on their own.
function normalizeProductName(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function nameTokenSet(s) {
  return new Set(normalizeProductName(s).split(' ').filter((w) => w.length > 2));
}
function nameSimilarity(a, b) {
  const na = normalizeProductName(a), nb = normalizeProductName(b);
  if (na && na === nb) return 1;
  const sa = nameTokenSet(a), sb = nameTokenSet(b);
  if (sa.size === 0 || sb.size === 0) return 0;
  let overlap = 0;
  sa.forEach((w) => { if (sb.has(w)) overlap += 1; });
  const union = new Set([...sa, ...sb]).size;
  return union ? overlap / union : 0;
}
// Groups products whose names are similar enough to be worth a human
// glance. Each group carries a reason ("exact name match", "similar name",
// or "shares a part number") and a numeric score so the UI can sort the
// most likely duplicates first. `dismissed` is a set of pair-keys
// (`id1|id2`, ids sorted) the person has already said aren't duplicates, so
// those pairs are excluded from future groups.
function findPossibleDuplicateGroups(products, dismissed) {
  const dismissedSet = new Set(dismissed || []);
  const pairKey = (a, b) => [a, b].sort().join('|');
  const pairs = [];
  for (let i = 0; i < products.length; i++) {
    for (let j = i + 1; j < products.length; j++) {
      const a = products[i], b = products[j];
      if (dismissedSet.has(pairKey(a.id, b.id))) continue;
      const sim = nameSimilarity(a.name, b.name);
      const samePart = !!(a.partNumber && b.partNumber && a.partNumber.trim().toLowerCase() === b.partNumber.trim().toLowerCase());
      if (sim >= 0.99) pairs.push({ a, b, score: 1, reason: 'Exact name match' });
      else if (sim >= 0.5) pairs.push({ a, b, score: sim, reason: 'Similar name' });
      else if (samePart) pairs.push({ a, b, score: 0.2, reason: 'Shares a part/mfr number (not reliable alone in this data -- double check the names)' });
    }
  }
  // Union-find-lite: merge overlapping pairs into groups so the same
  // product doesn't show up in multiple separate rows.
  const groups = [];
  pairs.forEach(({ a, b, score, reason }) => {
    let group = groups.find((g) => g.ids.has(a.id) || g.ids.has(b.id));
    if (!group) {
      group = { ids: new Set(), products: [], score, reason };
      groups.push(group);
    }
    if (!group.ids.has(a.id)) { group.ids.add(a.id); group.products.push(a); }
    if (!group.ids.has(b.id)) { group.ids.add(b.id); group.products.push(b); }
    group.score = Math.max(group.score, score);
  });
  return groups.sort((g1, g2) => g2.score - g1.score);
}

function findMatchingProduct(products, rawName, rawPart) {
  const name = (rawName || '').trim().toLowerCase();
  const part = (rawPart || '').trim().toLowerCase();
  if (part) {
    // This facility's part/mfr numbers have turned out to be shared across
    // genuinely unrelated products more than once (the same vendor control
    // number used for several different items) -- so the number alone
    // can't be trusted to disambiguate. When it maps to more than one
    // product, use the row's own name to pick the actual best match rather
    // than blindly taking whichever one happens to be first in the array.
    // Even a single part-number match gets a loose name sanity-check, for
    // the same reason.
    const byPart = products.filter((p) => (p.partNumber || '').trim().toLowerCase() === part);
    if (byPart.length === 1) {
      if (!name || nameSimilarity(byPart[0].name, name) > 0.15) return byPart[0];
    } else if (byPart.length > 1) {
      const scored = byPart.map((p) => ({ p, sim: nameSimilarity(p.name, name) }));
      scored.sort((a, b) => b.sim - a.sim);
      if (scored[0].sim > 0) return scored[0].p;
    }
  }
  if (name) {
    const exact = products.find((p) => p.name.trim().toLowerCase() === name);
    if (exact) return exact;
    const partial = products.find((p) => p.name.toLowerCase().includes(name) || name.includes(p.name.toLowerCase()));
    if (partial) return partial;
  }
  return null;
}

// Loose unit-of-measure matching: lowercase, strip punctuation, collapse
// common abbreviations ("oz"/"ounce", "ea"/"each", "pk"/"pack", "gal"/
// "gallon", "lb"/"pound") so "Fluid Ounce" and "fl oz" are recognized as the
// same unit without requiring an exact string match.
const UNIT_SYNONYMS = [
  [/\bfl(?:uid)?\.?\s*oz\.?\b/, 'ounce'], [/\boz\.?\b/, 'ounce'], [/\bounces?\b/, 'ounce'],
  [/\bea\.?\b/, 'each'], [/\bpieces?\b/, 'each'], [/\bpcs?\b/, 'each'],
  [/\bpk\.?\b/, 'pack'], [/\bpacks?\b/, 'pack'],
  [/\bgal\.?\b/, 'gallon'], [/\bgallons?\b/, 'gallon'],
  [/\blbs?\.?\b/, 'pound'], [/\bpounds?\b/, 'pound'],
  [/\btubes?\b/, 'tube'], [/\bdrums?\b/, 'drum'], [/\bpails?\b/, 'pail'], [/\bcans?\b/, 'can'],
];
function normalizeUnit(s) {
  let u = String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  UNIT_SYNONYMS.forEach(([pattern, canonical]) => { u = u.replace(pattern, canonical); });
  return u;
}
function unitsRoughlyMatch(a, b) {
  const na = normalizeUnit(a), nb = normalizeUnit(b);
  if (!na || !nb) return true; // nothing to compare against -- don't flag an absent unit as a mismatch
  if (na === nb) return true;
  return na.includes(nb) || nb.includes(na);
}
// The literal placeholder value new auto-created products get before anyone
// has set a real unit -- never a genuine tracked unit, so comparing a
// spreadsheet's real unit against it isn't a "mismatch," it's just "not set
// up yet." Treated separately below so the warning says the right thing.
const PLACEHOLDER_UNIT = 'unit';
function hasRealUnit(product) {
  return !!(product && product.unit && product.unit.trim().toLowerCase() !== PLACEHOLDER_UNIT);
}

// Accepts a true numeric cell, or a compound text cell like "6 pk",
// "2 pieces", "1 fl oz", "10pk" -- common in procurement exports where the
// quantity column is formatted as text with a trailing unit. Pulls the
// leading number out; returns null if nothing numeric is found at all.
function parseQtyLenient(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'string') {
    const m = v.trim().match(/^-?[\d,]*\.?\d+/);
    if (m) {
      const n = parseFloat(m[0].replace(/,/g, ''));
      return isNaN(n) ? null : n;
    }
  }
  return null;
}

function PurchaseBulkImportPanel({ products, activeMonth, onImport }) {
  const [open, setOpen] = useState(false);
  const [files, setFiles] = useState([]); // { fileName, workbook, sheetName, sheetNames, rawRows, monthKey, manual: {headerRow, itemCol, partCol, qtyCol} }
  const [mode, setMode] = useState('add');

  function handleFiles(e) {
    const list = Array.from(e.target.files || []);
    if (!list.length) return;
    Promise.all(list.map((file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const sheetName = wb.SheetNames[0];
          const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null });
          const monthKey = detectMonthFromWorkbook(wb) || detectMonthFromFilename(file.name) || (list.length === 1 ? activeMonth : '');
          const unitCol = detectUnitColumn(rawRows);
          resolve({
            fileName: file.name, workbook: wb, sheetName, sheetNames: wb.SheetNames, rawRows,
            monthKey: monthKey || '',
            manual: { headerRow: 1, itemCol: 1, partCol: 2, qtyCol: 3, unitCol: unitCol || '' },
          });
        } catch (err) {
          resolve({ fileName: file.name, workbook: null, sheetNames: [], rawRows: [], monthKey: '', manual: { headerRow: 1, itemCol: 1, partCol: 2, qtyCol: 3, unitCol: '' }, error: 'Could not read this file.' });
        }
      };
      reader.readAsArrayBuffer(file);
    }))).then((results) => setFiles(results));
  }

  function updateFile(idx, patch) {
    setFiles((prev) => { const next = [...prev]; next[idx] = { ...next[idx], ...patch }; return next; });
  }

  function switchSheet(idx, sheetName) {
    setFiles((prev) => {
      const next = [...prev];
      const f = next[idx];
      try {
        const rawRows = XLSX.utils.sheet_to_json(f.workbook.Sheets[sheetName], { header: 1, defval: null });
        next[idx] = { ...f, sheetName, rawRows };
      } catch (err) { /* leave as-is */ }
      return next;
    });
  }

  function parseFile(f) {
    if (f.error || !f.rawRows) return { entries: [], matched: 0, unmatched: 0, unitMismatches: 0 };
    const { headerRow, itemCol, partCol, qtyCol, unitCol } = f.manual;
    const headerIdx = Math.max(0, (Number(headerRow) || 1) - 1);
    const iIdx = Math.max(0, (Number(itemCol) || 1) - 1);
    const pIdx = partCol ? Math.max(0, (Number(partCol) || 1) - 1) : -1;
    const qIdx = Math.max(0, (Number(qtyCol) || 1) - 1);
    const uIdx = unitCol ? Math.max(0, (Number(unitCol) || 1) - 1) : -1;
    const entries = [];
    for (let r = headerIdx + 1; r < f.rawRows.length; r++) {
      const row = f.rawRows[r] || [];
      const name = row[iIdx];
      const part = pIdx >= 0 ? row[pIdx] : null;
      const qty = parseQtyLenient(row[qIdx]);
      const rawUnit = uIdx >= 0 ? row[uIdx] : null;
      if (!name || qty === null || qty <= 0) continue;
      const match = findMatchingProduct(products, String(name), part ? String(part) : '');
      // Two different situations, worth telling apart: a product that
      // already has a real, confirmed unit but doesn't match the sheet
      // (unitMismatch -- a genuine discrepancy worth double-checking), vs.
      // one that was auto-created by an earlier import and never had its
      // unit set up at all (needsUnitSetup -- not a conflict, just unfinished
      // setup, and we now know what its unit should actually be).
      const unitMismatch = !!(match && hasRealUnit(match) && rawUnit && !unitsRoughlyMatch(rawUnit, match.unit));
      const needsUnitSetup = !!(match && !hasRealUnit(match) && rawUnit);
      entries.push({
        rawName: String(name).trim(), rawPart: part ? String(part).trim() : '', qty,
        rawUnit: rawUnit ? String(rawUnit).trim() : '', matchedProduct: match, unitMismatch, needsUnitSetup,
      });
    }
    return {
      entries,
      matched: entries.filter((e) => e.matchedProduct).length,
      unmatched: entries.filter((e) => !e.matchedProduct).length,
      unitMismatches: entries.filter((e) => e.unitMismatch).length,
      unitSetupNeeded: entries.filter((e) => e.needsUnitSetup).length,
    };
  }

  const parsedFiles = files.map((f) => ({ f, ...parseFile(f) }));
  const totalMatched = parsedFiles.reduce((s, x) => s + x.matched, 0);
  const totalUnmatched = parsedFiles.reduce((s, x) => s + x.unmatched, 0);
  const totalUnitMismatches = parsedFiles.reduce((s, x) => s + x.unitMismatches, 0);
  const totalUnitSetupNeeded = parsedFiles.reduce((s, x) => s + x.unitSetupNeeded, 0);
  const readyToImport = parsedFiles.some((x) => x.entries.length > 0) && parsedFiles.every((x) => /^\d{4}-\d{2}$/.test(x.f.monthKey));

  function doImport() {
    const perFile = parsedFiles.map(({ f, entries }) => ({ monthKey: f.monthKey, entries }));
    onImport(perFile, mode);
    setFiles([]);
    setOpen(false);
  }

  return (
    <div style={{ border: '1px dashed #C8C4B8', borderRadius: 10, padding: 14, marginBottom: 16, background: '#FBFAF7' }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ display: 'flex', alignItems: 'center', gap: 7, background: 'none', border: 'none', cursor: 'pointer', color: '#1F4E4B', fontSize: 13, fontWeight: 500, padding: 0 }}
      >
        <Upload size={14} /> Bulk import from procurement spreadsheet
        <ChevronDown size={13} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s', marginLeft: 2 }} />
      </button>

      {open && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 11.5, color: '#8A8F8B', marginBottom: 10 }}>
            Upload procurement spreadsheets and map the item, quantity, and part-number columns — matched rows link to the Product Library automatically.
          </div>
          <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, border: '1px solid #DCD9D1', borderRadius: 7, padding: '7px 12px', fontSize: 12.5, cursor: 'pointer', background: '#fff' }}>
            <FileSpreadsheet size={14} color="#6B7570" />
            Choose file(s) (.xlsx, .xls)
            <input type="file" accept=".xlsx,.xls" multiple onChange={handleFiles} style={{ display: 'none' }} />
          </label>

          {parsedFiles.map(({ f, entries, matched, unmatched, unitMismatches, unitSetupNeeded }, idx) => (
            <div key={idx} style={{ marginTop: 14, border: '1px solid #E6E3DA', borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 12.5, fontWeight: 500, marginBottom: 8 }}>{f.fileName}</div>
              {f.error ? (
                <div style={{ fontSize: 12, color: '#A3312B' }}>{f.error}</div>
              ) : (
                <>
                  {f.sheetNames.length > 1 && (
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 8 }}>
                      <span style={{ fontSize: 11.5, color: '#6B7570' }}>Sheet:</span>
                      <select value={f.sheetName} onChange={(e) => switchSheet(idx, e.target.value)} style={{ fontSize: 11.5, padding: '3px 6px', borderRadius: 6, border: '1px solid #DCD9D1' }}>
                        {f.sheetNames.map((n) => <option key={n} value={n}>{n}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="scroll-x" style={{ marginBottom: 10 }}>
                    <table style={{ borderCollapse: 'collapse', fontSize: 10.5 }}>
                      <thead>
                        <tr>
                          <th style={{ padding: '2px 6px', color: '#8A8F8B' }}>Row</th>
                          {Array.from({ length: Math.min(8, Math.max(...(f.rawRows.slice(0, 6).map((r) => r.length)), 1)) }).map((_, ci) => (
                            <th key={ci} style={{ padding: '2px 6px', color: '#8A8F8B', fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}>{ci + 1}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {f.rawRows.slice(0, 6).map((r, ri) => (
                          <tr key={ri} style={{ background: (ri + 1) === Number(f.manual.headerRow) ? '#FDEBD7' : 'transparent' }}>
                            <td style={{ padding: '2px 6px', color: '#8A8F8B' }}>{ri + 1}</td>
                            {Array.from({ length: Math.min(8, Math.max(...(f.rawRows.slice(0, 6).map((rr) => rr.length)), 1)) }).map((_, ci) => (
                              <td key={ci} style={{ padding: '2px 6px', border: '1px solid #F0EEE7', maxWidth: 110, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                {r[ci] !== null && r[ci] !== undefined ? String(r[ci]) : ''}
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 10 }}>
                    <MiniNumField label="Header row #" value={f.manual.headerRow} onChange={(v) => updateFile(idx, { manual: { ...f.manual, headerRow: v } })} />
                    <MiniNumField label="Item name column #" value={f.manual.itemCol} onChange={(v) => updateFile(idx, { manual: { ...f.manual, itemCol: v } })} />
                    <MiniNumField label="Part/mfr # column (optional)" value={f.manual.partCol} onChange={(v) => updateFile(idx, { manual: { ...f.manual, partCol: v } })} />
                    <MiniNumField label="Quantity column #" value={f.manual.qtyCol} onChange={(v) => updateFile(idx, { manual: { ...f.manual, qtyCol: v } })} />
                    <MiniNumField label="Unit column # (optional)" value={f.manual.unitCol} onChange={(v) => updateFile(idx, { manual: { ...f.manual, unitCol: v } })} />
                    <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                      <span style={{ fontSize: 10.5, color: '#8A8F8B' }}>Month</span>
                      <input
                        value={f.monthKey} placeholder="YYYY-MM"
                        onChange={(e) => updateFile(idx, { monthKey: e.target.value.trim() })}
                        style={{ border: '1px solid ' + (/^\d{4}-\d{2}$/.test(f.monthKey) ? '#DCD9D1' : '#B3542A'), borderRadius: 6, padding: '5px 7px', fontSize: 12, width: 86, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}
                      />
                    </label>
                  </div>
                  <div style={{ fontSize: 12, color: '#3A4442' }}>
                    Found <strong>{entries.length}</strong> row(s) — <span style={{ color: '#3F7D4F' }}>{matched} matched</span> to existing products, <span style={{ color: '#B3542A' }}>{unmatched} new</span> (will be added to the library as "unconfirmed").
                  </div>
                  {unitMismatches > 0 && (
                    <div style={{ marginTop: 8, background: '#FBF2EC', border: '1px solid #E6C9B8', borderRadius: 7, padding: '8px 10px' }}>
                      <div style={{ fontSize: 11.5, color: '#A3312B', fontWeight: 600, marginBottom: 4 }}>
                        {unitMismatches} row(s) have a unit that doesn't match the product's confirmed unit — qty will still import, but double-check these:
                      </div>
                      {entries.filter((e) => e.unitMismatch).slice(0, 6).map((e, i) => (
                        <div key={i} style={{ fontSize: 11, color: '#3A4442' }}>
                          {e.rawName.slice(0, 40)} — sheet says "{e.rawUnit}", product is tracked in "{e.matchedProduct.unit}"
                        </div>
                      ))}
                      {unitMismatches > 6 && <div style={{ fontSize: 11, color: '#8A8F8B' }}>…and {unitMismatches - 6} more</div>}
                    </div>
                  )}
                  {unitSetupNeeded > 0 && (
                    <div style={{ marginTop: 8, background: '#FBFAF7', border: '1px solid #E6E3DA', borderRadius: 7, padding: '8px 10px' }}>
                      <div style={{ fontSize: 11.5, color: '#6B7570', fontWeight: 600, marginBottom: 4 }}>
                        {unitSetupNeeded} product(s) were auto-added by an earlier import and never had a real unit set — this sheet tells us what it should be:
                      </div>
                      {entries.filter((e) => e.needsUnitSetup).slice(0, 6).map((e, i) => (
                        <div key={i} style={{ fontSize: 11, color: '#3A4442' }}>
                          {e.rawName.slice(0, 40)} — sheet says "{e.rawUnit}"
                        </div>
                      ))}
                      {unitSetupNeeded > 6 && <div style={{ fontSize: 11, color: '#8A8F8B' }}>…and {unitSetupNeeded - 6} more</div>}
                      <div style={{ fontSize: 10.5, color: '#8A8F8B', marginTop: 4 }}>
                        Importing will set each one's unit from the sheet automatically — you'll still need to add its weight-per-unit (lb) and composition on the Purchases or Product Library tab.
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          ))}

          {parsedFiles.length > 0 && (
            <>
              <div style={{ display: 'flex', gap: 16, marginTop: 14 }}>
                <label style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 5 }}>
                  <input type="radio" checked={mode === 'add'} onChange={() => setMode('add')} /> Add to existing purchases
                </label>
                <label style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 5 }}>
                  <input type="radio" checked={mode === 'replace'} onChange={() => setMode('replace')} /> Replace this batch's prior import
                </label>
              </div>
              <div style={{ fontSize: 11.5, color: '#8A8F8B', marginTop: 6 }}>
                Total: {totalMatched} matched, {totalUnmatched} will create new products{totalUnitMismatches > 0 ? `, ${totalUnitMismatches} with a unit mismatch to review` : ''}. Each month needs a valid YYYY-MM before importing.
              </div>
              <button
                onClick={doImport}
                disabled={!readyToImport}
                style={{ marginTop: 10, background: readyToImport ? '#2F6F6B' : '#C8C4B8', color: '#fff', border: 'none', borderRadius: 7, padding: '8px 14px', fontSize: 12.5, cursor: readyToImport ? 'pointer' : 'not-allowed' }}
              >
                Import {totalMatched + totalUnmatched} purchase row(s)
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function PurchasesTab({ products, purchases, onAdd, onChange, onRemove, onPush, onPushAll, activeMonth, onBulkImport, onUpdateProduct }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const [editingProductId, setEditingProductId] = useState(null);
  const filtered = useMemo(() => {
    if (!q.trim()) return [];
    const s = q.toLowerCase();
    return products.filter((p) => p.name.toLowerCase().includes(s) || (p.partNumber || '').toLowerCase().includes(s)).slice(0, 8);
  }, [q, products]);

  function addPurchase(product) {
    onAdd({ productId: product.id, qty: '' });
    setQ(''); setOpen(false);
  }

  const contribs = useMemo(() => computePurchaseContributions(purchases, products), [purchases, products]);
  const totalVocLbs = contribs.filter((c) => c.kind === 'voc' || c.kind === 'both').reduce((s, c) => s + c.lbs, 0);
  const totalHapLbs = contribs.filter((c) => c.kind === 'hap' || c.kind === 'both').reduce((s, c) => s + c.lbs, 0);

  return (
    <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
      <div style={{ fontSize: 13.5, fontWeight: 500, marginBottom: 6 }}>Chemicals purchased this month</div>
      <div style={{ fontSize: 11.5, color: '#8A8F8B', marginBottom: 14 }}>
        Log this month's purchased quantities — composition % converts them to VOC/HAP lbs. A red tag means a product needs review; use the pencil to edit it here.
      </div>

      <PurchaseBulkImportPanel products={products} activeMonth={activeMonth} onImport={onBulkImport} />

      {products.length === 0 ? (
        <div style={{ fontSize: 12.5, color: '#8A8F8B', padding: '14px 4px', border: '1px dashed #DCD9D1', borderRadius: 8 }}>
          No products in the library yet — add products on the Product Library tab first, then come back here to log monthly quantities.
        </div>
      ) : (
        <div style={{ position: 'relative', marginBottom: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#fff', border: '1px solid #DCD9D1', borderRadius: 8, padding: '8px 10px' }}>
            <Search size={15} color="#8A8F8B" />
            <input
              value={q}
              onChange={(e) => { setQ(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)}
              placeholder="Search product library to add a purchase…"
              style={{ border: 'none', outline: 'none', fontSize: 13.5, flex: 1 }}
            />
          </div>
          {open && filtered.length > 0 && (
            <div style={{ position: 'absolute', zIndex: 20, top: '110%', left: 0, right: 0, background: '#fff', border: '1px solid #DCD9D1', borderRadius: 8, boxShadow: '0 6px 20px rgba(0,0,0,0.08)', maxHeight: 240, overflowY: 'auto' }}>
              {filtered.map((p) => (
                <div key={p.id} onMouseDown={(e) => e.preventDefault()} onClick={() => addPurchase(p)}
                  style={{ padding: '8px 10px', cursor: 'pointer', fontSize: 13, borderBottom: '1px solid #F0EEE7' }}>
                  <div style={{ color: '#1E2A28', fontWeight: 500 }}>{p.name}</div>
                  <div style={{ color: '#8A8F8B', fontSize: 11 }}>{p.unit} · {p.confirmedZero ? 'confirmed zero' : (CONFIDENCE_LABELS[p.confidence] || '')}</div>
                </div>
              ))}
            </div>
          )}
          {open && <div style={{ position: 'fixed', inset: 0, zIndex: 10 }} onClick={() => setOpen(false)} />}
        </div>
      )}

      {purchases.length === 0 && (
        <div style={{ fontSize: 12.5, color: '#8A8F8B', padding: '10px 4px' }}>No purchases logged for this month yet.</div>
      )}

      {purchases.map((pu, idx) => {
        const product = products.find((p) => p.id === pu.productId);
        const lbsTotal = product ? (Number(pu.qty) || 0) * (Number(product.weightPerUnitLbs) || 0) : 0;
        const needsReview = product && !product.confirmedZero && product.confidence !== 'confirmed';
        const isEditing = product && editingProductId === product.id;
        return (
          <div key={idx} style={{ borderBottom: '1px solid #F0EEE7' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 90px 100px 80px 28px 24px', gap: 8, alignItems: 'center', padding: '8px 4px' }}>
              <div style={{ fontSize: 12.5, display: 'flex', alignItems: 'center', gap: 6, minWidth: 0 }}>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{product ? product.name : '(deleted product)'}</span>
                {needsReview && (
                  <span style={{
                    flexShrink: 0, fontSize: 9.5, fontWeight: 600, color: '#A3312B', background: '#FBF2EC',
                    border: '1px solid #E6C9B8', borderRadius: 4, padding: '1px 6px',
                  }}>
                    {CONFIDENCE_LABELS[product.confidence] || 'needs review'}
                  </span>
                )}
                {pu.unitMismatch && (
                  <span
                    title={`The spreadsheet listed this in "${pu.sheetUnit}" — the product is tracked in "${product.unit}". Qty was imported as-is; verify it's still correct.`}
                    style={{
                      flexShrink: 0, fontSize: 9.5, fontWeight: 600, color: '#A3312B', background: '#FBF2EC',
                      border: '1px solid #E6C9B8', borderRadius: 4, padding: '1px 6px', cursor: 'help',
                    }}
                  >
                    unit? "{pu.sheetUnit}" vs "{product.unit}"
                  </span>
                )}
              </div>
              <input type="number" step="any" value={pu.qty} placeholder="Qty"
                onChange={(e) => onChange(idx, { ...pu, qty: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '5px 7px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }} />
              <div style={{ fontSize: 11.5, color: '#8A8F8B' }}>{product ? product.unit : ''}</div>
              <div style={{ fontSize: 11.5, color: '#6B7570', fontFamily: "'IBM Plex Mono', ui-monospace, monospace", textAlign: 'right' }}>{lbsTotal.toFixed(2)} lb</div>
              {product && (
                <button
                  onClick={() => setEditingProductId(isEditing ? null : product.id)}
                  title="Edit this product's composition"
                  style={{ border: 'none', background: 'none', cursor: 'pointer', color: isEditing ? '#2F6F6B' : '#8A8F8B' }}
                >
                  <Pencil size={13} />
                </button>
              )}
              <button onClick={() => onRemove(idx)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A' }}><Trash2 size={14} /></button>
            </div>
            {isEditing && (
              <div style={{ padding: '4px 4px 16px' }}>
                <ProductForm
                  initial={product}
                  onSave={(draft) => { onUpdateProduct(product.id, draft); setEditingProductId(null); }}
                  onCancel={() => setEditingProductId(null)}
                />
              </div>
            )}
          </div>
        );
      })}

      <div style={{ borderTop: '1px solid #F0EEE7', marginTop: 16, paddingTop: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>Computed contribution this month</div>
        {contribs.length === 0 && <div style={{ fontSize: 12, color: '#8A8F8B' }}>Nothing to compute yet.</div>}
        {contribs.map((c) => (
          <div key={c.cas} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, padding: '3px 0' }}>
            <span>{c.name} <span style={{ fontSize: 10.5, color: '#8A8F8B' }}>({c.kind === 'both' ? 'VOC+HAP' : c.kind.toUpperCase()})</span></span>
            <span style={{ fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}>{c.lbs.toFixed(4)} lb</span>
          </div>
        ))}
        <div style={{ display: 'flex', gap: 30, marginTop: 12 }}>
          <Stat label="Total VOC from purchases" value={totalVocLbs.toFixed(3)} unit="lb" />
          <Stat label="Total HAP from purchases" value={totalHapLbs.toFixed(3)} unit="lb" />
        </div>
        <button
          onClick={onPush}
          disabled={contribs.length === 0}
          style={{ marginTop: 14, background: contribs.length ? '#1F4E4B' : '#C8C4B8', color: '#fff', border: 'none', borderRadius: 7, padding: '9px 16px', fontSize: 13, fontWeight: 600, cursor: contribs.length ? 'pointer' : 'not-allowed' }}
        >
          Push to VOC &amp; HAP tracking
        </button>
        <button
          onClick={onPushAll}
          style={{ marginTop: 14, marginLeft: 10, background: '#fff', color: '#1F4E4B', border: '1px solid #1F4E4B', borderRadius: 7, padding: '9px 16px', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
        >
          Push ALL months to tracking
        </button>
        <div style={{ fontSize: 11, color: '#8A8F8B', marginTop: 8 }}>
          "Push to VOC & HAP tracking" only updates the month you're currently viewing. If you've logged purchases across several months and haven't pushed each one individually, use "Push ALL months" to sync everything in one go.
        </div>
        <div style={{ fontSize: 11, color: '#8A8F8B', marginTop: 6 }}>
          Safe to click again anytime — it replaces only the rows it previously added from purchases, alongside (not overwriting) anything you entered manually or bulk-imported.
        </div>
      </div>
    </div>
  );
}

function ChemTab({ title, kind, list, entries, onAdd, onChange, onRemove, totalLbs, netLbs }) {
  return (
    <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
      <div style={{ fontSize: 13.5, fontWeight: 500, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 11.5, color: '#8A8F8B', marginBottom: 14 }}>

        {entries.length > 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 90px 90px 32px', gap: 10, padding: '0 4px 6px', borderBottom: '1px solid #DCD9D1' }}>

            <div style={{ fontSize: 10.5, color: '#8A8F8B', fontWeight: 600 }}>Lbs</div>

        <Stat label="Net emitted (after waste diversion)" value={netLbs.toFixed(3)} unit="lb" />

}

function WasteTab({ entries, onAdd, onChange, onRemove, wasteVOCLbs, wasteHAPLbs }) {
  return (
    <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
      <div style={{ fontSize: 13.5, fontWeight: 500, marginBottom: 4 }}>Non-emitted solvent waste collected</div>
      <div style={{ fontSize: 12, color: '#8A8F8B', marginBottom: 6 }}>Waste shipped off-site isn't counted as emitted (Condition 5.1(e)). Enter drums/containers collected this month.</div>
      <div style={{ fontSize: 11.5, color: '#3A4442', background: '#FBFAF7', border: '1px solid #E6E3DA', borderRadius: 7, padding: '8px 10px', marginBottom: 14, lineHeight: 1.5 }}>
        <strong>Default: Mixed Waste Solvent profile</strong> (50% VOC, 5.831 lb/gal — Profile E340388 rev 8). Only gallons should change month to month; edit % or lb/gal only if the profile is revised, or for a different waste stream with its own composition.
      </div>

      {entries.length > 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr 0.8fr 0.7fr 0.6fr 0.6fr 30px', gap: 8, padding: '0 0 6px', borderBottom: '1px solid #DCD9D1' }}>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>Description</div>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>Quantity</div>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>% content</div>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>Lb/gal</div>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>VOC</div>
          <div style={{ fontSize: 10, color: '#8A8F8B', fontWeight: 600 }}>HAP</div>
          <div />
        </div>
      )}

      {entries.map((w, idx) => {
        const mode = w.inputMode === 'lbs' ? 'lbs' : 'gallons';
        const totalLbs = wasteEntryTotalLbs(w);
        const computedGallons = (Number(w.densityLbGal) || 0) > 0 ? totalLbs / Number(w.densityLbGal) : 0;
        return (
          <div key={idx} style={{ padding: '8px 0', borderBottom: '1px solid #F0EEE7' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr 0.8fr 0.7fr 0.6fr 0.6fr 30px', gap: 8, alignItems: 'center', fontSize: 12.5 }}>
              <input placeholder="Description / drum #" value={w.description}
                onChange={(e) => onChange(idx, { ...w, description: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 8px', fontSize: 12.5 }} />
              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                <input
                  placeholder={mode === 'lbs' ? 'Lbs' : 'Gallons'} type="number"
                  value={mode === 'lbs' ? w.lbsInput : w.gallons}
                  onChange={(e) => onChange(idx, mode === 'lbs' ? { ...w, lbsInput: e.target.value } : { ...w, gallons: e.target.value })}
                  style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 8px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace", width: '100%' }}
                />
                <div style={{ display: 'flex', borderRadius: 6, overflow: 'hidden', border: '1px solid #DCD9D1', flexShrink: 0 }}>
                  <button
                    onClick={() => onChange(idx, { ...w, inputMode: 'gallons' })}
                    style={{ fontSize: 10, padding: '5px 6px', border: 'none', cursor: 'pointer', background: mode === 'gallons' ? '#1F4E4B' : '#fff', color: mode === 'gallons' ? '#fff' : '#6B7570' }}
                  >gal</button>
                  <button
                    onClick={() => onChange(idx, { ...w, inputMode: 'lbs' })}
                    style={{ fontSize: 10, padding: '5px 6px', border: 'none', cursor: 'pointer', background: mode === 'lbs' ? '#1F4E4B' : '#fff', color: mode === 'lbs' ? '#fff' : '#6B7570' }}
                  >lbs</button>
                </div>
              </div>
              <input placeholder="% of original content" type="number" value={w.pctContent}
                onChange={(e) => onChange(idx, { ...w, pctContent: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 8px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }} />
              <input placeholder="lb/gal" type="number" value={w.densityLbGal}
                onChange={(e) => onChange(idx, { ...w, densityLbGal: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 8px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }} />
              <label style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <input type="checkbox" checked={w.countsVOC} onChange={(e) => onChange(idx, { ...w, countsVOC: e.target.checked })} /> VOC
              </label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <input type="checkbox" checked={w.countsHAP} onChange={(e) => onChange(idx, { ...w, countsHAP: e.target.checked })} /> HAP
              </label>
              <button onClick={() => onRemove(idx)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A' }}>
                <Trash2 size={14} />
              </button>
            </div>
            <div style={{ fontSize: 10.5, color: '#8A8F8B', marginTop: 4, paddingLeft: 2 }}>
              {mode === 'lbs'
                ? `= ${computedGallons.toFixed(2)} gal (at ${w.densityLbGal || 0} lb/gal) · ${totalLbs.toFixed(2)} lb total material`
                : `= ${totalLbs.toFixed(2)} lb total material`}
            </div>
          </div>
        );
      })}

      <button onClick={onAdd} style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 14, background: '#F0EEE7', border: 'none', borderRadius: 7, padding: '8px 12px', fontSize: 12.5, cursor: 'pointer', color: '#1F4E4B' }}>
        <Plus size={14} /> Add waste entry
      </button>

      <div style={{ display: 'flex', gap: 30, marginTop: 18, paddingTop: 14, borderTop: '1px solid #F0EEE7' }}>
        <Stat label="VOC diverted (not emitted)" value={wasteVOCLbs.toFixed(3)} unit="lb" tone="good" />
        <Stat label="HAP diverted (not emitted)" value={wasteHAPLbs.toFixed(3)} unit="lb" tone="good" />
      </div>
    </div>
  );
}

function DuplicateGroupRow({ group, onMerge, onDismiss }) {
  const [keepId, setKeepId] = useState(group.products[0].id);
  const ids = group.products.map((p) => p.id);
  return (
    <div style={{ border: '1px solid #E6C9B8', background: '#FBF2EC', borderRadius: 8, padding: 12 }}>
      <div style={{ fontSize: 11, color: '#A3312B', fontWeight: 600, marginBottom: 8 }}>{group.reason}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
        {group.products.map((p) => (
          <label key={p.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 12.5, cursor: 'pointer' }}>
            <input type="radio" checked={keepId === p.id} onChange={() => setKeepId(p.id)} style={{ marginTop: 3 }} />
            <span>
              <span style={{ fontWeight: keepId === p.id ? 600 : 400, color: '#1E2A28' }}>{p.name}</span>
              <span style={{ color: '#8A8F8B', marginLeft: 6 }}>
                {p.partNumber ? `part ${p.partNumber} · ` : ''}{p.unit || 'no unit'} · {p.confirmedZero ? 'confirmed zero' : (CONFIDENCE_LABELS[p.confidence] || p.confidence)}
              </span>
            </span>
          </label>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button
          onClick={() => onMerge(keepId, ids.filter((id) => id !== keepId))}
          style={{ fontSize: 12, fontWeight: 600, background: '#2F6F6B', color: '#fff', border: 'none', borderRadius: 6, padding: '6px 12px', cursor: 'pointer' }}
        >
          Merge into selected
        </button>
        <button
          onClick={() => onDismiss(ids)}
          style={{ fontSize: 12, background: '#fff', color: '#3A4442', border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 12px', cursor: 'pointer' }}
        >
          Not duplicates
        </button>
      </div>
      <div style={{ fontSize: 10.5, color: '#8A8F8B', marginTop: 8 }}>
        Merging keeps the selected product and moves every month's purchase quantities from the other(s) onto it, then removes the other(s) from the library.
      </div>
    </div>
  );
}

function CollapsibleCard({ title, defaultOpen = false, badge, children }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div style={{ marginTop: 14, background: '#fff', border: '1px solid #E6E3DA', borderRadius: 10, padding: 14 }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}
      >
        <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#3A4442', fontWeight: 600 }}>
          <ChevronDown size={13} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s', flexShrink: 0 }} />
          <span style={{ borderLeft: '3px solid #2F6F6B', paddingLeft: 8 }}>{title}</span>
        </span>
        {badge}
      </button>
      {open && <div style={{ marginTop: 10 }}>{children}</div>}
    </div>
  );
}

function FieldDefinitions({ items }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderTop: '1px solid #F0EEE7', paddingTop: 10, marginTop: 4 }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', cursor: 'pointer', color: '#6B7570', fontSize: 12, padding: 0 }}
      >
        <ChevronDown size={13} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }} />
        What each field means
      </button>
      {open && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '4px 20px', marginTop: 10, fontSize: 12, color: '#3A4442' }}>
          {items.map(([label, desc]) => (
            <div key={label}><strong>{label}:</strong> {desc}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function MiniField({ label, value, onChange }) {
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <span style={{ color: '#8A8F8B', fontSize: 10.5 }}>{label}</span>
      <input
        type="number" step="any" value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '5px 7px', fontSize: 12, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}
      />
    </label>
  );
}

function MetricsTab({ monthKeys, results }) {
  const cols = [
    { key: 'naturalGasCCF', label: 'Nat. Gas — boiler (CCF)', fmt: (v) => v.toFixed(0) },
    { key: 'naturalGasCCFTotal', label: 'Nat. Gas — ALL meters (CCF)', fmt: (v) => v.toFixed(0) },
    { key: 'boilerDieselGal', label: 'Boiler Diesel (gal)', fmt: (v) => v.toFixed(1) },
    { key: 'generatorDieselGal', label: 'Gen. Diesel (gal)', fmt: (v) => v.toFixed(1) },
  ];
  const pollutants = [
    { key: 'CO', label: 'CO (lb)' },
    { key: 'NOx', label: 'NOx (lb)' },
    { key: 'SO2', label: 'SO2 (lb)' },
    { key: 'PM', label: 'PM (lb)' },
    { key: 'PM25', label: 'PM2.5 (lb)' },
    { key: 'PM10', label: 'PM10 (lb)' },
  ];

  if (monthKeys.length === 0) {
    return (
      <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 40, textAlign: 'center', color: '#6B7570' }}>
        Add a reporting month to see the full metrics table.
      </div>
    );
  }

  const sorted = [...monthKeys].sort();

  return (
    <div className="scroll-x" style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
      <div style={{ fontSize: 12, color: '#3A4442', marginBottom: 14, background: '#FBFAF7', border: '1px solid #E6E3DA', borderRadius: 8, padding: '10px 12px', lineHeight: 1.5 }}>
        <strong>What this shows:</strong> fuel throughput (nat. gas, boiler diesel, generator diesel) drives the six criteria pollutants (CO, NOx, SO2, PM, PM2.5, PM10) and GHG using Condition 10.0's emission factors. VOC is combustion VOC plus your VOC Usage entries; HAP comes entirely from your HAP Usage entries — both net of anything logged as non-emitted waste. <strong>Total Emission</strong> is a rough combined sum for reference only (PM10/PM2.5 are subsets of PM, so it isn't a true non-overlapping total). Purchases only show up here after you've pushed them to the VOC/HAP Usage tabs for that month.
      </div>
      <table style={{ borderCollapse: 'collapse', width: '100%', fontSize: 11.5, fontFamily: "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" }}>
        <thead>
          <tr>
            <th style={thStyle}>Month</th>
            {cols.map((c) => <th key={c.key} style={thStyle}>{c.label}</th>)}
            {pollutants.map((p) => <th key={p.key} style={thStyle}>{p.label}</th>)}
            <th style={thStyle}>VOC (lb)</th>
            <th style={thStyle}>HAP (lb)</th>
            <th style={thStyle}>GHG (tons CO2e)</th>
            <th style={thStyle}>Total Emission (lb)</th>
            <th style={thStyle}>Last Edited</th>
          </tr>
        </thead>
        <tbody>
          {sorted.map((k) => {
            const r = results[k];
            return (
              <tr key={k}>
                <td style={{ ...tdStyle, fontFamily: "'IBM Plex Sans', sans-serif", whiteSpace: 'nowrap' }}>{monthLabel(k)}</td>
                <td style={tdStyle}>{r.naturalGasCCF.toFixed(0)}</td>
                <td style={{ ...tdStyle, fontWeight: (r.naturalGasCCFTotal - r.naturalGasCCF) > 10000 ? 700 : 400, color: (r.naturalGasCCFTotal - r.naturalGasCCF) > 10000 ? '#A3312B' : '#1E2A28' }}>
                  {r.naturalGasCCFTotal.toFixed(0)}
                </td>
                <td style={tdStyle}>{r.boilerDieselGal.toFixed(1)}</td>
                <td style={tdStyle}>{r.generatorDieselGal.toFixed(1)}</td>
                {pollutants.map((p) => (
                  <td key={p.key} style={tdStyle}>{r.combustion[p.key].toFixed(3)}</td>
                ))}
                <td style={tdStyle}>{r.totalVOCLbs.toFixed(3)}</td>
                <td style={tdStyle}>{r.totalHAPLbs.toFixed(3)}</td>
                <td style={tdStyle}>{r.ghgTons.toFixed(4)}</td>
                <td style={{ ...tdStyle, fontWeight: 600 }}>{r.totalEmissionLbs.toFixed(2)}</td>
                <td style={{ ...tdStyle, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 10.5, color: '#8A8F8B', whiteSpace: 'nowrap' }}>
                  {r.lastEditedAt ? new Date(r.lastEditedAt).toLocaleDateString() : '—'}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

const thStyle = { textAlign: 'right', padding: '6px 8px', borderBottom: '2px solid #E6E3DA', color: '#6B7570', fontWeight: 500, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11 };
const tdStyle = { textAlign: 'right', padding: '6px 8px', borderBottom: '1px solid #F0EEE7', color: '#1E2A28' };


const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>

<script>
// Explicit compile-and-run (rather than relying on Babel's own auto-scan of
// <script type="text/babel"> tags) so a failure is visible on the page
// instead of just a blank screen.
window.addEventListener('DOMContentLoaded', function () {
  var showError = function (label, err) {
    var el = document.getElementById('boot-error');
    el.style.display = 'block';
    el.textContent = label + ':\n\n' + (err && err.stack ? err.stack : String(err));
    console.error(label, err);
  };
  try {
    if (!window.React) throw new Error('React failed to load from CDN');
    if (!window.ReactDOM) throw new Error('ReactDOM failed to load from CDN');
    if (!window.Babel) throw new Error('Babel standalone failed to load from CDN');
    var code = document.getElementById('app-source').textContent;
    var compiled = window.Babel.transform(code, { presets: ['react'] }).code;
    try {
      (0, eval)(compiled);
    } catch (runErr) {
      showError('App crashed while running', runErr);
    }
  } catch (err) {
    showError('App failed to start', err);
  }
});
</script>
</body>
