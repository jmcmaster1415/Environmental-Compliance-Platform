<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #F5F4F0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }
  #root { min-height: 100%; }
  /* This page uses a large number of hand-tuned colors assuming a light
     background throughout (status colors, severity indicators, etc.) --
     opting out of automatic dark-mode inversion keeps those meaningful. */
  :root:not([data-theme="light"]) { color-scheme: light; }
  /* NOTE: deliberately no blanket "table { max-width: 100% }" rule -- that
     was forcing every table (including wide data tables meant to scroll
     horizontally inside their own container) to squeeze to fit the
     viewport instead of actually overflowing, which is what makes the
     parent's overflow-x: auto scrollbar appear in the first place. Wide
     tables get their own min-width below; only non-scrolling tables should
     ever need width capped. */
  .scroll-x {
    overflow-x: auto;
    border: 1px solid #E6E3DA;
    border-radius: 8px;
    /* Visible edge fade as a hint that there's more to scroll to, in
       addition to the scrollbar itself. */
    background:
      linear-gradient(to right, #fff 30%, rgba(255,255,255,0)),
      linear-gradient(to right, rgba(0,0,0,0.06), rgba(0,0,0,0)) right / 6px 100% no-repeat;
    background-attachment: local, scroll;
  }
  .scroll-x table { min-width: max-content; }
  ::-webkit-scrollbar { height: 12px; width: 12px; }
  ::-webkit-scrollbar-track { background: #EFEDE6; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #B8B4A8; border-radius: 8px; border: 2px solid #EFEDE6; }
  ::-webkit-scrollbar-thumb:hover { background: #8A8F8B; }
  * { scrollbar-width: auto; scrollbar-color: #B8B4A8 #EFEDE6; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    #boot-error { display: none !important; }
    table { font-size: 10px; }
    a[href]::after { content: none !important; }
    * { box-shadow: none !important; }
  }
  #boot-error {
    display: none; padding: 24px; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    white-space: pre-wrap; color: #A3312B; background: #FBFAF7;
    border: 1px solid #E6C9B8; border-radius: 10px; margin: 24px; font-size: 13px;
  }
</style>

function cloneList(list) { return list.map((x) => ({ ...x })); }

/* ---------------------------------------------------------------
   Storage helpers — uses the published-page `db` capability.
   NOTE: this data is shared — visible AND editable by anyone who opens
   this artifact, not just the original author. That's intentional: this
   app is meant to be a live, jointly-edited copy across whoever it's
   shared with. Each month lives in its own document (months/{key}),
   with products and GHG settings as two more small documents — this
   keeps every write small and targeted rather than rewriting one giant
   blob on every keystroke.
--------------------------------------------------------------- */
let dbHandle = null; // resolved once, reused by every load/save call

async function getDb() {
  if (dbHandle) return dbHandle;
  try {
    dbHandle = await window.claude.use('db');
  } catch (e) {
    dbHandle = null;
  }
  return dbHandle;
}

async function loadData() {
  const db = await getDb();
  if (!db) return { months: {}, products: [], settings: null };
  try {
    const [settingsSnap, productsSnap, monthsSnap] = await Promise.all([
      db.doc('app/settings').get(),
      db.doc('app/products').get(),
      db.collection('months').get(),
    ]);
    const months = {};
    monthsSnap.docs.forEach((d) => { months[d.id] = d.data(); });
    return {
      settings: settingsSnap.exists ? settingsSnap.data() : null,
      products: productsSnap.exists ? (productsSnap.data().list || []) : [],
      months,
    };
  } catch (e) {
    console.error('Load failed', e);
    return { months: {}, products: [], settings: null };
  }
}

// Writes only the documents that actually changed between the previous and
// next state, so a single field edit doesn't rewrite every month.
async function saveData(nextData, prevData) {
  const db = await getDb();
  if (!db) throw new Error('db capability unavailable');
  const prev = prevData || { months: {}, products: [], settings: null };
  const ops = [];

  if (JSON.stringify(prev.settings) !== JSON.stringify(nextData.settings)) {
    ops.push(db.doc('app/settings').set(nextData.settings || {}));
  }
  if (JSON.stringify(prev.products) !== JSON.stringify(nextData.products)) {
    ops.push(db.doc('app/products').set({ list: nextData.products || [] }));
  }
  const prevMonths = prev.months || {};
  const nextMonths = nextData.months || {};
  const allKeys = new Set([...Object.keys(prevMonths), ...Object.keys(nextMonths)]);
  allKeys.forEach((k) => {
    if (JSON.stringify(prevMonths[k]) !== JSON.stringify(nextMonths[k])) {
      if (nextMonths[k] === undefined) {
        ops.push(db.collection('months').doc(k).delete());
      } else {
        ops.push(db.collection('months').doc(k).set(nextMonths[k]));
      }
    }
  });
  await Promise.all(ops);
}

function emptyMonth(key) {
  return {
    key,
    natGasMeters: cloneList(DEFAULT_GAS_METERS),
    boilerDiesel: cloneList(DEFAULT_BOILERS),
    generatorDiesel: cloneList(DEFAULT_GENERATORS),
    dieselSulfurPct: 0.0015,
    nOxMode: 'NOx_uncontrolled',
    vocEntries: [],
    hapEntries: [],
    wasteEntries: [],
    purchases: [],
  };
}

// Migrates any month saved under the older flat-field schema
// (naturalGasCCF / boilerDieselGal / generatorDieselGal as single
// numbers) into the per-source arrays, without losing data.
const DECOMMISSIONED_BOILERS = ['Boiler 3', 'Boiler 5', 'Boiler 7'];
const DECOMMISSIONED_GENERATORS = ['Bldg. 58, 275 kW', 'Bldg. 50, 275 kW', 'Bldg. 55, 105 kW'];

function normalizeMonth(m) {
  let natGasMeters = m.natGasMeters
    ? m.natGasMeters
    : (m.naturalGasCCF ? [{ name: 'Natural Gas (imported total)', ccf: m.naturalGasCCF }] : cloneList(DEFAULT_GAS_METERS));
  const gasSeedForMonth = NAT_GAS_CCF_SEED[m.key] || {};
  natGasMeters = natGasMeters.map((g) => {
    let next = g;
    if (next.isBoiler === undefined) {
      // Only the Interrupt Gas (B.28 Boilers) meter feeds Condition 10.0's
      // boiler emission factors -- Firm Gas (B.22,38 Heat) serves non-boiler
      // equipment and is excluded from the facility's own emissions basis
      // (confirmed against the Emission Factor tab: its MMcf figure matches
      // the Interrupt meter alone, not the combined total). Unrecognized/
      // legacy meter names default to true to preserve prior behavior.
      const spec = DEFAULT_GAS_METERS.find((d) => d.name === next.name);
      next = { ...next, isBoiler: spec ? spec.isBoiler : true };
    }
    if ((next.ccf === '' || next.ccf === undefined || next.ccf === null) && gasSeedForMonth[next.name] !== undefined) {
      next = { ...next, ccf: gasSeedForMonth[next.name] };
    }
    return next;
  });
  let boilerDiesel = m.boilerDiesel
    ? m.boilerDiesel
    : (m.boilerDieselGal ? [{ name: 'Boiler Diesel (imported total)', gal: m.boilerDieselGal, nsps: true }] : cloneList(DEFAULT_BOILERS));
  let generatorDiesel = m.generatorDiesel
    ? m.generatorDiesel
    : (m.generatorDieselGal ? [{ name: 'Generator Diesel (imported total)', gal: m.generatorDieselGal }] : cloneList(DEFAULT_GENERATORS));
  // Decommissioned units — strip from any month that still carries them
  // (e.g. seeded before these were taken out of service), not just new months.
  boilerDiesel = boilerDiesel.filter((b) => !DECOMMISSIONED_BOILERS.includes(b.name));
  generatorDiesel = generatorDiesel.filter((g) => !DECOMMISSIONED_GENERATORS.includes(g.name));
  // Migrate generator rows to the hourly-reading model: fill in known specs
  // (amps/%load/gal-per-hr) by name if missing, and backfill actual historical
  // hour-meter readings for Jan-Aug 2026 where nothing has been entered yet.
  // Any gal the user already typed manually (old flat-gal schema) is preserved
  // as a fallback so nothing silently zeroes out.
  const seedForMonth = GENERATOR_HOURLY_SEED[m.key] || {};
  generatorDiesel = generatorDiesel.map((g) => {
    const spec = DEFAULT_GENERATORS.find((d) => d.name === g.name);
    const withSpecs = {
      amps: g.amps !== undefined ? g.amps : (spec ? spec.amps : ''),
      pctLoad: g.pctLoad !== undefined ? g.pctLoad : (spec ? spec.pctLoad : ''),
      galPerHr: g.galPerHr !== undefined ? g.galPerHr : (spec ? spec.galPerHr : ''),
      hourlyReading: g.hourlyReading !== undefined ? g.hourlyReading : '',
      runHoursOverride: g.runHoursOverride !== undefined ? g.runHoursOverride : '',
      ...g,
    };
    if ((withSpecs.hourlyReading === '' || withSpecs.hourlyReading === undefined) && seedForMonth[g.name] !== undefined) {
      withSpecs.hourlyReading = seedForMonth[g.name];
    }
    const runHoursSeedForMonth = GENERATOR_RUN_HOURS_SEED[m.key] || {};
    if ((withSpecs.runHoursOverride === '' || withSpecs.runHoursOverride === undefined) && runHoursSeedForMonth[g.name] !== undefined) {
      withSpecs.runHoursOverride = runHoursSeedForMonth[g.name];
    }
    return withSpecs;
  });
  const purchases = m.purchases || [];

  // Load of the official, as-filed VOC/HAP totals for this month, if we have
  // them. Versioned (not just a one-time boolean) so a correction to this
  // seed data -- like the one that stripped out two reference rows
  // ("VOC Rolling Annual Total" and "Permit Annual Total Limit") that had
  // been mistakenly swept in as if they were chemical entries -- can force a
  // re-apply even for months that already loaded an earlier, wrong version.
  // Still only overwrites up to the current version; edits made after that
  // are safe.
  let vocEntries = m.vocEntries;
  let hapEntries = m.hapEntries;
  let officialChemVersion = m._officialChemVersion || 0;
  if (officialChemVersion < OFFICIAL_CHEM_SEED_VERSION && (OFFICIAL_VOC_SEED[m.key] || OFFICIAL_HAP_SEED[m.key])) {
    if (OFFICIAL_VOC_SEED[m.key]) {
      vocEntries = OFFICIAL_VOC_SEED[m.key].map((e) => ({ ...e, fromOfficialReport: true }));
    }
    if (OFFICIAL_HAP_SEED[m.key]) {
      hapEntries = OFFICIAL_HAP_SEED[m.key].map((e) => ({ ...e, fromOfficialReport: true }));
    }
    officialChemVersion = OFFICIAL_CHEM_SEED_VERSION;
  }

  return { ...m, natGasMeters, boilerDiesel, generatorDiesel, purchases, vocEntries, hapEntries, _officialChemVersion: officialChemVersion };
}

// Computes tracked-substance contributions (lbs) from this month's purchases,
// using each product's weight-per-unit and composition percentages.
function computePurchaseContributions(purchases, products) {
  const map = {};
  (purchases || []).forEach((p) => {
    const product = (products || []).find((pr) => pr.id === p.productId);
    if (!product) return;
    const lbsTotal = (Number(p.qty) || 0) * (Number(product.weightPerUnitLbs) || 0);
    if (lbsTotal <= 0) return;
    (product.composition || []).forEach((c) => {
      const pct = Number(c.pct) || 0;
      if (pct <= 0) return;
      const lbs = lbsTotal * pct / 100;
      const key = c.cas;
      if (!map[key]) map[key] = { cas: c.cas, name: c.name, kind: c.kind, lbs: 0 };
      map[key].lbs += lbs;
    });
  });
  return Object.values(map);
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function last12Keys(allKeys, anchorKey) {
  const sorted = [...allKeys].sort();
  const idx = sorted.indexOf(anchorKey);
  const upto = idx === -1 ? sorted : sorted.slice(0, idx + 1);
  return upto.slice(-12);
}

/* ---------------------------------------------------------------
   Calculation core
--------------------------------------------------------------- */
function wasteEntryTotalLbs(w) {
  if (w.inputMode === 'lbs') return Number(w.lbsInput) || 0;
  return (Number(w.gallons) || 0) * (Number(w.densityLbGal) || 0);
}

// Computes Run Hours (this month's hourly reading minus the previous
// reading) and Gal Used (Run Hours x Gal/hr) for each generator, given a
// lookup of prior readings by generator name. Mirrors the facility's
// GENERATOR RUN LOG methodology exactly.
function computeGeneratorRunHours(generatorDiesel, prevReadings) {
  return (generatorDiesel || []).map((g) => {
    const curr = Number(g.hourlyReading);
    const hasReading = g.hourlyReading !== '' && g.hourlyReading !== null && g.hourlyReading !== undefined && !isNaN(curr);
    const prev = prevReadings ? prevReadings[g.name] : undefined;
    const hasPrev = prev !== undefined && prev !== null && !isNaN(Number(prev));
    const computedRunHours = (hasReading && hasPrev) ? Math.max(0, curr - Number(prev)) : null;
    const hasOverride = g.runHoursOverride !== undefined && g.runHoursOverride !== '' && g.runHoursOverride !== null && !isNaN(Number(g.runHoursOverride));
    const runHours = hasOverride ? Number(g.runHoursOverride) : computedRunHours;
    const galUsed = runHours !== null ? runHours * (Number(g.galPerHr) || 0) : (Number(g.gal) || 0);
    return { ...g, runHours, computedRunHours, isOverridden: hasOverride, galUsed };
  });
}

function computeMonth(rawMonth, ghgSettings, generatorRows) {
  const m = normalizeMonth(rawMonth);
  const ghg = ghgSettings || GHG_DEFAULTS;

  const genRows = generatorRows || computeGeneratorRunHours(m.generatorDiesel, {});
  // Only meters flagged isBoiler feed the Condition 10.0 boiler emission
  // factors -- matches the facility's own Emission Factor tab exactly (its
  // basis quantity is the Interrupt/Boiler meter alone, excluding Firm Gas).
  const naturalGasCCF = (m.natGasMeters || []).filter((g) => g.isBoiler).reduce((s, g) => s + (Number(g.ccf) || 0), 0);
  const naturalGasCCFTotal = (m.natGasMeters || []).reduce((s, g) => s + (Number(g.ccf) || 0), 0);
  const boilerDieselGal = (m.boilerDiesel || []).reduce((s, b) => s + (Number(b.gal) || 0), 0);
  const generatorDieselGal = genRows.reduce((s, g) => s + (Number(g.galUsed) || 0), 0);

  // CCF = Centum Cubic Feet (100 ft^3); MMcf = Million cubic feet = 10,000 CCF.
  // (This had been dividing by 1,000 -- a leftover mix-up with Mcf, thousand
  // cubic feet -- which made every natural-gas-driven figure 10x too high.
  // Verified against the facility's own Emission Factor tab: 376,640 CCF of
  // annual boiler gas is explicitly stated there as "37.664 MMcf" --
  // 376640 / 10000, not / 1000.)
  const ngMMcf = naturalGasCCF / 10000; // boiler-only, feeds Condition 10.0 criteria pollutants + PSEL-facing GHG
  const ngMMcfAll = naturalGasCCFTotal / 10000; // boiler + Firm Gas combined -- feeds the facility-wide GHG figure used for OAR 340-215 registration
  const boilerKgal = boilerDieselGal / 1000;
  const generatorKgal = generatorDieselGal / 1000;
  const dieselKgal = boilerKgal + generatorKgal;
  const dieselGalTotal = boilerDieselGal + generatorDieselGal;

  // Criteria pollutants, split by source (mirrors the Metrics tab layout)
  const bySource = {
    PM: { ng: ngMMcf * EF.naturalGas.PM, diesel: dieselKgal * EF.fuelOil.PM },
    PM10: { ng: ngMMcf * EF.naturalGas.PM10, diesel: dieselKgal * EF.fuelOil.PM10 },
    PM25: { ng: ngMMcf * EF.naturalGas.PM25, diesel: dieselKgal * EF.fuelOil.PM25 },
    NOx: { ng: ngMMcf * EF.naturalGas[m.nOxMode || 'NOx_uncontrolled'], diesel: dieselKgal * EF.fuelOil.NOx },
    CO: { ng: ngMMcf * EF.naturalGas.CO, diesel: dieselKgal * EF.fuelOil.CO },
    SO2: { ng: ngMMcf * EF.naturalGas.SO2, diesel: dieselKgal * (EF.fuelOil.SO2_k * (m.dieselSulfurPct || 0)) },
    VOC: { ng: ngMMcf * EF.naturalGas.VOC, diesel: dieselKgal * EF.fuelOil.VOC },
  };
  const combustion = {};
  Object.keys(bySource).forEach((k) => { combustion[k] = bySource[k].ng + bySource[k].diesel; });

  // Greenhouse gases — GWP-weighted EPA Part 98 Subpart C method (see
  // GHG_DEFAULTS note above): lb-CO2e = heat content x quantity x 2.205 lb/kg
  // x (CO2 factor + CH4 factor x CH4 GWP + N2O factor x N2O GWP).
  // Computed at two scopes:
  //  - ghgTons (PSEL, 74,000 ton/yr, Condition 3.1): boiler-only natural gas,
  //    same scope as every other criteria pollutant above.
  //  - ghgTonsAllGas (OAR 340-215 registration, 2,756 ton/yr): facility-wide
  //    natural gas (including Firm Gas), matching the separate GHG Calculator
  //    submission used for that reporting requirement.
  const dieselMMBtu = dieselGalTotal * ghg.diesel.heatContentMMBtuPerGal;
  const dieselKgTotal = dieselMMBtu * (ghg.diesel.co2KgPerMMBtu + ghg.diesel.ch4KgPerMMBtu * ghg.gwpCH4 + ghg.diesel.n2oKgPerMMBtu * ghg.gwpN2O);

  const ngMMBtu = ngMMcf * ghg.naturalGas.heatContentMMBtuPerMMcf;
  const ngKg = ngMMBtu * (ghg.naturalGas.co2KgPerMMBtu + ghg.naturalGas.ch4KgPerMMBtu * ghg.gwpCH4 + ghg.naturalGas.n2oKgPerMMBtu * ghg.gwpN2O);
  const ghgTons = ((ngKg + dieselKgTotal) * KG_TO_LB) / 2000;

  const ngMMBtuAll = ngMMcfAll * ghg.naturalGas.heatContentMMBtuPerMMcf;
  const ngKgAll = ngMMBtuAll * (ghg.naturalGas.co2KgPerMMBtu + ghg.naturalGas.ch4KgPerMMBtu * ghg.gwpCH4 + ghg.naturalGas.n2oKgPerMMBtu * ghg.gwpN2O);
  const ghgTonsAllGas = ((ngKgAll + dieselKgTotal) * KG_TO_LB) / 2000;

  const vocUsageLbs = (m.vocEntries || []).reduce((s, e) => s + (Number(e.lbs) || 0), 0);
  const hapUsageLbs = (m.hapEntries || []).reduce((s, e) => s + (Number(e.lbs) || 0), 0);

  const wasteVOCLbs = (m.wasteEntries || []).reduce((s, w) => {
    if (!w.countsVOC) return s;
    return s + (wasteEntryTotalLbs(w) * (Number(w.pctContent) || 0) / 100);
  }, 0);
  const wasteHAPLbs = (m.wasteEntries || []).reduce((s, w) => {
    if (!w.countsHAP) return s;
    return s + (wasteEntryTotalLbs(w) * (Number(w.pctContent) || 0) / 100);
  }, 0);

  const processVOCLbs = Math.max(0, vocUsageLbs - wasteVOCLbs);
  const processHAPLbs = Math.max(0, hapUsageLbs - wasteHAPLbs);

  const totalVOCLbs = combustion.VOC + processVOCLbs;

  // Per-chemical HAP breakdown (usage minus a proportional share of waste, simple allocation)
  const hapByChem = {};
  (m.hapEntries || []).forEach((e) => {
    const key = e.cas;
    hapByChem[key] = (hapByChem[key] || { cas: e.cas, name: e.name, lbs: 0 });
    hapByChem[key].lbs += Number(e.lbs) || 0;
  });
  const wasteFactor = hapUsageLbs > 0 ? Math.max(0, (hapUsageLbs - wasteHAPLbs)) / hapUsageLbs : 1;
  Object.values(hapByChem).forEach((c) => { c.lbs = c.lbs * wasteFactor; });

  const totalEmissionLbs = combustion.PM + combustion.PM10 + combustion.PM25 + combustion.SO2
    + combustion.NOx + combustion.CO + totalVOCLbs + processHAPLbs + (ghgTons * 2000);

  return {
    combustion, bySource,
    vocUsageLbs, hapUsageLbs, wasteVOCLbs, wasteHAPLbs,
    processVOCLbs, processHAPLbs, totalVOCLbs,
    totalHAPLbs: processHAPLbs,
    hapByChem,
    ghgTons,
    ghgTonsAllGas,
    totalEmissionLbs,
    naturalGasCCF,
    naturalGasCCFTotal,
    lastEditedAt: m._lastEditedAt || null,
    boilerDieselGal,
    generatorDieselGal,
    generatorRows: genRows,
  };
}

/* ---------------------------------------------------------------
   Excel import — VOC / HAP monthly usage sheets
   Expects columns like CAS | Chemical | Total Lbs. | Total Tons
   (matches the layout of the facility's VOC / HAP workbook tabs)
--------------------------------------------------------------- */
function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const row = rows[i] || [];
    const hasCAS = row.some((c) => typeof c === 'string' && c.trim().toLowerCase().replace(/[^a-z]/g, '').includes('cas'));
    const hasChem = row.some((c) => typeof c === 'string' && c.trim().toLowerCase().includes('chemical'));
    if (hasCAS && hasChem) return i;
  }
  return -1;
}

// `override` lets the user manually specify 0-based indices when auto-detection
// fails: { headerRowIdx, casIdx, chemIdx, lbsIdx, tonsIdx }
function parseChemicalSheet(rows, override) {
  if (override) {
    const { headerRowIdx, casIdx, chemIdx, lbsIdx, tonsIdx } = override;
    return extractEntries(rows, headerRowIdx, casIdx, chemIdx, lbsIdx, tonsIdx);
  }

  const headerIdx = findHeaderRow(rows);
  if (headerIdx === -1) {
    const preview = (rows[0] || []).slice(0, 6).filter((c) => c !== null && c !== '').join(', ');
    return {
      entries: [], error: 'Could not find a header row containing "CAS" and "Chemical" columns on this sheet.'
        + (preview ? ' (First row on the sheet reads: "' + preview + '…")' : ''),
      needsManualMapping: true,
      rows,
    };
  }
  const header = (rows[headerIdx] || []).map((c) => (typeof c === 'string' ? c.trim().toLowerCase() : ''));
  const casIdx = header.findIndex((c) => c.replace(/[^a-z]/g, '').includes('cas'));
  const chemIdx = header.findIndex((c) => c.includes('chemical'));
  const lbsIdx = header.findIndex((c) => c.includes('lb'));
  const tonsIdx = header.findIndex((c) => c.includes('ton'));

  if (casIdx === -1 || chemIdx === -1 || (lbsIdx === -1 && tonsIdx === -1)) {
    return {
      entries: [],
      error: 'Found a header row ("' + (rows[headerIdx] || []).filter((c) => c).join(', ') + '"), but could not identify CAS, Chemical, and a lbs/tons quantity column.',
      needsManualMapping: true,
      rows,
      headerRowIdx: headerIdx,
    };
  }
  return extractEntries(rows, headerIdx, casIdx, chemIdx, lbsIdx, tonsIdx);
}

function extractEntries(rows, headerRowIdx, casIdx, chemIdx, lbsIdx, tonsIdx) {
  const entries = [];
  let skippedZero = 0;
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const cas = casIdx >= 0 ? row[casIdx] : null;
    const name = chemIdx >= 0 ? row[chemIdx] : null;
    if (cas === null || cas === undefined || cas === '' || name === null || name === undefined || name === '') continue;
    let lbs = null;
    const lbsRaw = lbsIdx >= 0 ? row[lbsIdx] : null;
    const tonsRaw = tonsIdx >= 0 ? row[tonsIdx] : null;
    if (typeof lbsRaw === 'number') lbs = lbsRaw;
    else if (typeof tonsRaw === 'number') lbs = tonsRaw * 2000;
    if (lbs === null || !isFinite(lbs)) continue;
    if (lbs <= 0) { skippedZero += 1; continue; }
    entries.push({ cas: String(cas).trim(), name: String(name).trim(), lbs });
  }
  return { entries, error: null, skippedZero };
}

function mergeEntries(existing, incoming) {
  const map = {};
  (existing || []).forEach((e) => { map[e.cas] = { ...e, lbs: Number(e.lbs) || 0 }; });
  incoming.forEach((e) => {
    if (map[e.cas]) map[e.cas] = { ...map[e.cas], lbs: map[e.cas].lbs + e.lbs };
    else map[e.cas] = { ...e };
  });
  return Object.values(map);
}

// Tiny inline-SVG bar sparkline — purely presentational, draws from numbers
// the caller already computed. Never computes or re-derives any figure itself.
function MiniTrendChart({ values, color, height = 36 }) {
  const w = 100, h = height, pad = 2;
  const max = Math.max(...values, 0.0001);
  const n = values.length;
  const barW = n > 0 ? (w - pad * 2) / n : 0;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none" style={{ display: 'block' }}>
      {values.map((v, i) => {
        const barH = Math.max(1, (v / max) * (h - pad * 2));
        const x = pad + i * barW;
        const y = h - pad - barH;
        return <rect key={i} x={x + barW * 0.12} y={y} width={Math.max(1, barW * 0.76)} height={barH} rx={1} fill={color} opacity={i === n - 1 ? 1 : 0.45} />;
      })}
    </svg>
  );
}

const MONTH_NAMES = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];

// Scans the first row for a header that looks like a unit-of-measure
// column ("U of M", "UOM", "Unit"), so the bulk importer has a sensible
// starting guess instead of defaulting to blank every time.
function detectUnitColumn(rawRows) {
  const header = (rawRows && rawRows[0]) || [];
  for (let i = 0; i < header.length; i++) {
    const h = String(header[i] || '').toLowerCase();
    if (/u\s*of\s*m|^uom$|\bunit\b/.test(h)) return i + 1;
  }
  return null;
}

function detectMonthFromFilename(fileName) {
  const lower = fileName.toLowerCase();
  const yearMatch = lower.match(/(20\d{2})/);
  const monthWordIdx = MONTH_NAMES.findIndex((mn) => lower.includes(mn));
  if (yearMatch && monthWordIdx !== -1) {
    return yearMatch[1] + '-' + String(monthWordIdx + 1).padStart(2, '0');
  }
  const iso = lower.match(/(20\d{2})[-_](\d{1,2})\b/);
  if (iso) return iso[1] + '-' + iso[2].padStart(2, '0');
  const mdy = lower.match(/\b(\d{1,2})[-_](20\d{2})\b/);
  if (mdy) return mdy[2] + '-' + mdy[1].padStart(2, '0');
  return null;
}

function detectMonthFromWorkbook(wb) {
  try {
    const coverName = wb.SheetNames.find((n) => n.toLowerCase().includes('cover'));
    const target = coverName || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[target], { header: 1, defval: null });
    for (const row of rows.slice(0, 30)) {
      for (const cell of row) {
        if (cell instanceof Date && !isNaN(cell)) {
          return cell.getFullYear() + '-' + String(cell.getMonth() + 1).padStart(2, '0');
        }
      }
    }
  } catch (e) { /* ignore */ }
  return null;
}

function findChemicalSheetName(wb, kind) {
  const lowerNames = wb.SheetNames.map((n) => n.toLowerCase());
  // Prefer an exact-ish match (e.g. "VOC" over "VOC Waste")
  let idx = lowerNames.findIndex((n) => n === kind);
  if (idx === -1) idx = lowerNames.findIndex((n) => n.includes(kind) && !n.includes('waste'));
  if (idx === -1) idx = lowerNames.findIndex((n) => n.includes(kind));
  return idx !== -1 ? wb.SheetNames[idx] : wb.SheetNames[0];
}

function BulkImportPanel({ kind, activeMonth, existingMonthKeys, onBulkImport }) {
  const [rows, setRows] = useState([]); // { fileName, monthKey, sheetName, sheetNames, entries, error }
  const [mode, setMode] = useState('replace');
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setBusy(true);
    Promise.all(files.map((file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          const sheetName = findChemicalSheetName(wb, kind);
          const sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null });
          const parsed = parseChemicalSheet(sheetRows);
          const monthKey = detectMonthFromWorkbook(wb) || detectMonthFromFilename(file.name) || (files.length === 1 ? activeMonth : '');
          resolve({
            fileName: file.name,
            monthKey: monthKey || '',
            monthGuessed: !!monthKey,
            sheetName,
            sheetNames: wb.SheetNames,
            workbook: wb,
            rawRows: sheetRows,
            entries: parsed.entries || [],
            error: parsed.error || null,
            needsManualMapping: !!parsed.needsManualMapping,
            manual: { headerRow: (parsed.headerRowIdx != null ? parsed.headerRowIdx + 1 : 1), casCol: 1, chemCol: 2, qtyCol: 3, qtyUnit: 'lb' },
          });
        } catch (err) {
          resolve({ fileName: file.name, monthKey: '', sheetNames: [], entries: [], error: 'Could not read this file — make sure it is a .xlsx or .xls file.' });
        }
      };
      reader.readAsArrayBuffer(file);
    }))).then((results) => {
      setRows(results);
      setBusy(false);
    });
  }

  function updateRow(idx, patch) {
    setRows((prev) => {
      const next = [...prev];
      next[idx] = { ...next[idx], ...patch };
      return next;
    });
  }

  function reparseSheet(idx, workbookSheetName) {
    setRows((prev) => {
      const next = [...prev];
      const row = next[idx];
      if (!row || !row.workbook) return prev;
      try {
        const sheetRows = XLSX.utils.sheet_to_json(row.workbook.Sheets[workbookSheetName], { header: 1, defval: null });
        const parsed = parseChemicalSheet(sheetRows);
        next[idx] = {
          ...row, sheetName: workbookSheetName, rawRows: sheetRows,
          entries: parsed.entries || [], error: parsed.error || null,
          needsManualMapping: !!parsed.needsManualMapping,
          manual: { headerRow: (parsed.headerRowIdx != null ? parsed.headerRowIdx + 1 : 1), casCol: 1, chemCol: 2, qtyCol: 3, qtyUnit: 'lb' },
        };
      } catch (err) {
        next[idx] = { ...row, sheetName: workbookSheetName, entries: [], error: 'Could not read that sheet.' };
      }
      return next;
    });
  }

  function updateManual(idx, patch) {
    setRows((prev) => {
      const next = [...prev];
      next[idx] = { ...next[idx], manual: { ...next[idx].manual, ...patch } };
      return next;
    });
  }

  function applyManualMapping(idx) {
    setRows((prev) => {
      const next = [...prev];
      const row = next[idx];
      if (!row || !row.rawRows) return prev;
      const man = row.manual;
      const override = {
        headerRowIdx: Math.max(0, (Number(man.headerRow) || 1) - 1),
        casIdx: Math.max(0, (Number(man.casCol) || 1) - 1),
        chemIdx: Math.max(0, (Number(man.chemCol) || 1) - 1),
        lbsIdx: man.qtyUnit === 'lb' ? Math.max(0, (Number(man.qtyCol) || 1) - 1) : -1,
        tonsIdx: man.qtyUnit === 'ton' ? Math.max(0, (Number(man.qtyCol) || 1) - 1) : -1,
      };
      const parsed = parseChemicalSheet(row.rawRows, override);
      const stillEmpty = (parsed.entries || []).length === 0;
      next[idx] = {
        ...row,
        entries: parsed.entries || [],
        error: stillEmpty ? 'That mapping found 0 chemical rows with a positive quantity — double-check the column numbers and quantity unit.' : null,
        needsManualMapping: stillEmpty,
      };
      return next;
    });
  }

  const validRows = rows.filter((r) => r.monthKey && /^\d{4}-\d{2}$/.test(r.monthKey) && r.entries.length > 0);
  const totalChemicals = validRows.reduce((s, r) => s + r.entries.length, 0);

  return (
    <div style={{ border: '1px dashed #C8C4B8', borderRadius: 10, padding: 14, marginBottom: 16, background: '#FBFAF7' }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ display: 'flex', alignItems: 'center', gap: 7, background: 'none', border: 'none', cursor: 'pointer', color: '#1F4E4B', fontSize: 13, fontWeight: 500, padding: 0 }}
      >
        <Upload size={14} /> Bulk import from Excel
        <ChevronDown size={13} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s', marginLeft: 2 }} />
      </button>

      {open && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 11.5, color: '#8A8F8B', marginBottom: 10 }}>
            Upload one or more monthly reports — the month and chemical data are detected automatically. Review the detected month below before importing.
          </div>
          <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, border: '1px solid #DCD9D1', borderRadius: 7, padding: '7px 12px', fontSize: 12.5, cursor: 'pointer', background: '#fff' }}>
            <FileSpreadsheet size={14} color="#6B7570" />
            {busy ? 'Reading files…' : 'Choose file(s) (.xlsx, .xls)'}
            <input type="file" accept=".xlsx,.xls" multiple onChange={handleFiles} style={{ display: 'none' }} />
          </label>

          {rows.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11.5 }}>
                <thead>
                  <tr>
                    <th style={{ ...thStyleLeft }}>File</th>
                    <th style={{ ...thStyleLeft, width: 110 }}>Month</th>
                    <th style={{ ...thStyleLeft, width: 140 }}>Sheet</th>
                    <th style={{ ...thStyleLeft, width: 70, textAlign: 'right' }}>Found</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, idx) => (
                    <React.Fragment key={idx}>
                      <tr>
                        <td style={tdStyleLeft}>
                          {r.fileName}
                          {r.error && <div style={{ color: '#A3312B', fontSize: 10.5 }}>{r.error}</div>}
                        </td>
                        <td style={tdStyleLeft}>
                          <input
                            value={r.monthKey}
                            placeholder="YYYY-MM"
                            onChange={(e) => updateRow(idx, { monthKey: e.target.value.trim() })}
                            style={{
                              border: '1px solid ' + (/^\d{4}-\d{2}$/.test(r.monthKey) ? '#DCD9D1' : '#B3542A'),
                              borderRadius: 6, padding: '4px 6px', fontSize: 11.5, width: 86, fontFamily: "'IBM Plex Mono', ui-monospace, monospace",
                            }}
                          />
                        </td>
                        <td style={tdStyleLeft}>
                          {r.sheetNames && r.sheetNames.length > 1 ? (
                            <select
                              value={r.sheetName}
                              onChange={(e) => reparseSheet(idx, e.target.value)}
                              style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '3px 5px', fontSize: 11 }}
                            >
                              {r.sheetNames.map((n) => <option key={n} value={n}>{n}</option>)}
                            </select>
                          ) : (r.sheetName || '—')}
                        </td>
                        <td style={{ ...tdStyleLeft, textAlign: 'right', fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}>{r.entries.length}</td>
                      </tr>
                      {r.needsManualMapping && (
                        <tr>
                          <td colSpan={4} style={{ padding: '4px 8px 14px', borderBottom: '1px solid #F0EEE7' }}>
                            <ManualMappingForm row={r} onChange={(patch) => updateManual(idx, patch)} onApply={() => applyManualMapping(idx)} />
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>

              <div style={{ display: 'flex', gap: 16, marginTop: 12 }}>
                <label style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 5 }}>
                  <input type="radio" checked={mode === 'replace'} onChange={() => setMode('replace')} />
                  Replace each month's entries
                </label>
                <label style={{ fontSize: 12, display: 'flex', alignItems: 'center', gap: 5 }}>
                  <input type="radio" checked={mode === 'add'} onChange={() => setMode('add')} />
                  Add to existing entries
                </label>
              </div>

              <div style={{ fontSize: 11.5, color: '#8A8F8B', marginTop: 6 }}>
                {validRows.length} of {rows.length} file(s) ready to import ({totalChemicals} chemical row(s) total). Rows with a red month box need a valid YYYY-MM before they'll be included.
              </div>

              <button
                disabled={validRows.length === 0}
                onClick={() => { onBulkImport(validRows, mode); setRows([]); setOpen(false); }}
                style={{ marginTop: 10, background: validRows.length ? '#2F6F6B' : '#C8C4B8', color: '#fff', border: 'none', borderRadius: 7, padding: '8px 14px', fontSize: 12.5, cursor: validRows.length ? 'pointer' : 'not-allowed' }}
              >
                Import {validRows.length} file(s) — {totalChemicals} chemical row(s)
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const thStyleLeft = { textAlign: 'left', padding: '5px 8px', borderBottom: '2px solid #E6E3DA', color: '#6B7570', fontWeight: 500, fontSize: 11 };
const tdStyleLeft = { textAlign: 'left', padding: '5px 8px', borderBottom: '1px solid #F0EEE7', color: '#1E2A28', verticalAlign: 'top' };

  const preview = (row.rawRows || []).slice(0, 8);
  const colCount = Math.min(8, Math.max(...preview.map((r) => r.length), 1));
  const man = row.manual || { headerRow: 1, casCol: 1, chemCol: 2, qtyCol: 3, qtyUnit: 'lb' };

  return (
    <div style={{ background: '#FBFAF7', border: '1px solid #E6C9B8', borderRadius: 8, padding: 10 }}>
      <div style={{ fontSize: 11.5, color: '#8A5A2E', marginBottom: 8 }}>
        Couldn't auto-map this sheet's columns. Preview below (columns numbered 1–{colCount}) — tell us which row is the header and which columns hold CAS, Chemical name, and quantity, then apply.
      </div>

      <div className="scroll-x" style={{ marginBottom: 10 }}>
        <table style={{ borderCollapse: 'collapse', fontSize: 10.5 }}>
          <thead>
            <tr>
              <th style={{ padding: '2px 6px', color: '#8A8F8B' }}>Row</th>
              {Array.from({ length: colCount }).map((_, ci) => (

              ))}
            </tr>
          </thead>
          <tbody>
