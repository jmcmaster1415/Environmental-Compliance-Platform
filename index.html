/* ---------------------------------------------------------------
   Main App
--------------------------------------------------------------- */
function App() {
  const [data, setData] = useState({ months: {}, settings: null, products: [] });
  const [loaded, setLoaded] = useState(false);
  const [activeMonth, setActiveMonth] = useState(null);
  const [tab, setTab] = useState('home');
  const [lastCalculated, setLastCalculated] = useState(null);

  const saveTimerRef = useRef(null);
  const latestDataRef = useRef(data);
  // What's actually confirmed written to the db — saveData diffs against
  // this, not the previous render's state, so only genuinely-changed
  // documents get rewritten.
  const lastSavedRef = useRef(data);
  const [saveStatus, setSaveStatus] = useState('saved'); // 'saved' | 'unsaved' | 'saving' | 'error'
  const [dbAvailable, setDbAvailable] = useState(true);

  useEffect(() => {
    loadData().then((d) => {
      if (!d.settings) d.settings = JSON.parse(JSON.stringify(GHG_DEFAULTS));
      // Migrate old GHG settings schema (the lb-per-unit, non-GWP-weighted
      // fields used briefly, matching the historical Annual Report's
      // apparently-incorrect practice, before reading the actual 2017
      // permit directly and finding Condition 10.0 has no GHG row at all) to
      // the heat-content/GWP fields -- otherwise stale saved settings are
      // missing these fields entirely and GHG multiplies against `undefined`.
      if (!d.settings.naturalGas || d.settings.naturalGas.heatContentMMBtuPerMMcf === undefined) {
        d.settings = JSON.parse(JSON.stringify(GHG_DEFAULTS));
      }
      if (!d.products) d.products = [];
      if (!d.months || Object.keys(d.months).length === 0) {
        d.months = {};
        for (let mo = 1; mo <= 12; mo++) {
          const key = '2026-' + String(mo).padStart(2, '0');
          d.months[key] = emptyMonth(key);
        }
      } else {
        Object.keys(d.months).forEach((k) => { d.months[k] = normalizeMonth(d.months[k]); });
      }
      setData(d);
      latestDataRef.current = d;
      lastSavedRef.current = { months: {}, products: [], settings: null }; // force initial seed to actually write
      const keys = Object.keys(d.months).sort();
      setActiveMonth(keys.length ? keys[0] : null);
      setLoaded(true);
      saveData(d, lastSavedRef.current).then(() => {
        lastSavedRef.current = d;
      }).catch(() => setDbAvailable(false));
    });
  }, []);

  const doSave = useCallback(async () => {
    setSaveStatus('saving');
    try {
      // Staleness guard: re-check the real current state of every OTHER
      // month right before writing, in case something elsewhere (another
      // window open on this same artifact, most commonly) changed it since
      // this window last synced. Without this, a save here would silently
      // overwrite that newer copy with this window's older one -- exactly
      // the kind of cross-window clobbering that caused real data loss
      // earlier. The month currently being edited here is always trusted as
      // the user's intent; everything else, if it's moved on without us,
      // adopts the fresher remote copy instead of overwriting it.
      const db = await getDb();
      if (db) {
        const remoteSnap = await db.collection('months').get();
        const remoteByKey = {};
        remoteSnap.docs.forEach((d) => { remoteByKey[d.id] = d.data(); });
        const prevMonths = lastSavedRef.current.months || {};
        const localMonths = latestDataRef.current.months || {};
        let adopted = false;
        const mergedMonths = { ...localMonths };
        Object.keys(localMonths).forEach((k) => {
          if (k === activeMonthRef.current) return;
          const expected = prevMonths[k];
          const remote = remoteByKey[k];
          if (JSON.stringify(expected) !== JSON.stringify(remote)) {
            mergedMonths[k] = remote;
            adopted = true;
          }
        });
        if (adopted) {
          const merged = { ...latestDataRef.current, months: mergedMonths };
          latestDataRef.current = merged;
          lastSavedRef.current = { ...lastSavedRef.current, months: { ...prevMonths, ...remoteByKey } };
          setData(merged);
        }
      }
      await saveData(latestDataRef.current, lastSavedRef.current);
      lastSavedRef.current = latestDataRef.current;
      setSaveStatus('saved');
      setDbAvailable(true);
    } catch (e) {
      setSaveStatus('error');
    }
  }, []);

  // Live sync: other viewers' edits to months OTHER than the one currently
  // open for editing here appear without a reload. The active month (and
  // products, while the Product Library tab is open) are deliberately left
  // untouched by incoming snapshots, so a remote write -- including our own
  // echoing back -- can never clobber a local in-progress edit.
  const activeMonthRef = useRef(activeMonth);
  useEffect(() => { activeMonthRef.current = activeMonth; }, [activeMonth]);
  const tabRef = useRef(tab);
  useEffect(() => { tabRef.current = tab; }, [tab]);

  useEffect(() => {
    if (!loaded) return;
    let unsubMonths = null, unsubProducts = null, unsubSettings = null;
    let cancelled = false;
    (async () => {
      const db = await getDb();
      if (!db || cancelled) return;

      unsubMonths = db.collection('months').onSnapshot((snap) => {
        const remoteChanges = {};
        snap.docChanges().forEach((chg) => {
          const k = chg.doc.id;
          if (k === activeMonthRef.current) return;
          const incoming = chg.type === 'removed' ? undefined : chg.doc.data();
          // Some backends report every document in a collection as
          // "changed" whenever any single one actually changes -- without
          // this check, saving just ONE month (e.g. adding a new one) would
          // make every other month visibly reset to its last-synced copy
          // and recompute, even though nothing about them actually changed.
          // Comparing content first means a no-op report is genuinely a
          // no-op, not a full-collection flash.
          const existing = latestDataRef.current.months ? latestDataRef.current.months[k] : undefined;
          if (JSON.stringify(existing) === JSON.stringify(incoming)) return;
          remoteChanges[k] = incoming;
        });
        if (Object.keys(remoteChanges).length === 0) return;
        setData((prev) => {
          const months = { ...prev.months };
          Object.entries(remoteChanges).forEach(([k, v]) => { if (v === undefined) delete months[k]; else months[k] = v; });
          const next = { ...prev, months };
          latestDataRef.current = next;
          return next;
        });
        const savedMonths = { ...lastSavedRef.current.months };
        Object.entries(remoteChanges).forEach(([k, v]) => { if (v === undefined) delete savedMonths[k]; else savedMonths[k] = v; });
        lastSavedRef.current = { ...lastSavedRef.current, months: savedMonths };
      }, () => {});

      unsubProducts = db.doc('app/products').onSnapshot((snap) => {
        if (tabRef.current === 'products' || !snap.exists) return;
        const list = snap.data().list || [];
        setData((prev) => {
          const next = { ...prev, products: list };
          latestDataRef.current = next;
          return next;
        });
        lastSavedRef.current = { ...lastSavedRef.current, products: list };
      }, () => {});

      unsubSettings = db.doc('app/settings').onSnapshot((snap) => {
        if (!snap.exists) return;
        const s = snap.data();
        setData((prev) => {
          const next = { ...prev, settings: s };
          latestDataRef.current = next;
          return next;
        });
        lastSavedRef.current = { ...lastSavedRef.current, settings: s };
      }, () => {});
    })();
    return () => {
      cancelled = true;
      if (unsubMonths) unsubMonths();
      if (unsubProducts) unsubProducts();
      if (unsubSettings) unsubSettings();
    };
  }, [loaded]);

  const persist = useCallback((next) => {
    setData(next);
    latestDataRef.current = next;
    setSaveStatus('unsaved');
    // Debounce so rapid edits (e.g. typing character by character) batch into
    // one write instead of firing a storage call per keystroke — the more
    // writes in flight, the more likely one silently fails without a manual
    // save to fall back on.
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => { doSave(); }, 900);
  }, [doSave]);

  function saveNow() {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    doSave();
  }

  async function exportBackup() {
    const stamp = new Date().toISOString().slice(0, 10);
    try {
      const downloads = await window.claude.use('downloads');
      if (!downloads) {
        window.alert("This view can't save files directly. Try opening the artifact in a regular browser tab.");
        return;
      }
      await downloads.save({
        filename: `hap-voc-backup-${stamp}.json`,
        data: JSON.stringify(data, null, 2),
      });
    } catch (e) {
      if (e && e.code === 'declined') return; // viewer said no — not an error
      console.error('Export failed', e);
      window.alert('Export failed: ' + ((e && e.message) || 'unknown error'));
    }
  }

  // Same rolling-12-month aggregation as the `rolling` useMemo, but callable
  // for ANY anchor month, not just the latest -- needed because the actual
  // Annual Air Report shows one such rolling total per calendar month, each
  // ending at a different point, not a single current snapshot.
  function computeRollingAt(anchorKey) {
    const window12 = last12Keys(monthKeys, anchorKey);
    let vocTons = 0, hapTons = 0, ghgTons = 0, ghgTonsAllGas = 0;
    const pollutantTons = { PM: 0, PM10: 0, PM25: 0, SO2: 0, NOx: 0, CO: 0 };
    window12.forEach((k) => {
      const r = results[k];
      if (!r) return;
      vocTons += r.totalVOCLbs * K;
      hapTons += r.totalHAPLbs * K;
      ghgTons += r.ghgTons;
      ghgTonsAllGas += r.ghgTonsAllGas;
      Object.keys(pollutantTons).forEach((p) => { pollutantTons[p] += r.combustion[p] * K; });
    });
    return { window12, vocTons, hapTons, ghgTons, ghgTonsAllGas, pollutantTons };
  }

  async function exportDeqReport() {
    if (monthKeys.length === 0) {
      window.alert('No data yet to export — add a month and enter some data first.');
      return;
    }
    try {
      // Styled rows, using the same palette as the app itself (deep teal,
      // cream, status colors) so the export reads as the same product, not
      // a generic spreadsheet. xlsx-js-style (see script tag) is what makes
      // writing these styles possible at all -- the stock xlsx library can
      // only do this with a paid Pro license.
      const TEAL = '1F4E4B', TEAL_LIGHT = 'DCEAE8', CREAM = 'F5F4F0', INK = '1E2A28', MUTED = '6B7570';
      const GREEN = '3F7D4F', AMBER = 'B3542A', RED = 'A3312B';
      const thin = { style: 'thin', color: { rgb: 'DCD9D1' } };
      const border = { top: thin, bottom: thin, left: thin, right: thin };
      const S = {
        company: { font: { sz: 15, bold: true, color: { rgb: TEAL } } },
        permit: { font: { sz: 10.5, color: { rgb: MUTED } } },
        title: { font: { sz: 12.5, bold: true, color: { rgb: INK } } },
        subtitle: { font: { sz: 9.5, italic: true, color: { rgb: MUTED } } },
        sectionHeader: { font: { bold: true, color: { rgb: CREAM } }, fill: { fgColor: { rgb: TEAL } }, alignment: { vertical: 'center' }, border },
        colHeader: { font: { bold: true, sz: 9.5, color: { rgb: TEAL } }, fill: { fgColor: { rgb: TEAL_LIGHT } }, alignment: { horizontal: 'right' }, border },
        colHeaderLabel: { font: { bold: true, sz: 9.5, color: { rgb: TEAL } }, fill: { fgColor: { rgb: TEAL_LIGHT } }, border },
        label: { font: { sz: 10.5, color: { rgb: INK } }, border },
        num: { font: { sz: 10.5, color: { rgb: INK } }, alignment: { horizontal: 'right' }, numFmt: '0.00', border },
        limit: { font: { sz: 10.5, color: { rgb: MUTED } }, alignment: { horizontal: 'right' }, border },
        note: { font: { sz: 9, italic: true, color: { rgb: MUTED } } },
        chemHeader: { font: { bold: true, sz: 9.5, color: { rgb: TEAL } }, fill: { fgColor: { rgb: TEAL_LIGHT } }, border },
        chemRow: { font: { sz: 10 }, border },
      };
      const actualStyle = (pct) => ({
        font: { sz: 10.5, bold: pct >= 70, color: { rgb: pct >= 100 ? RED : pct >= 70 ? AMBER : INK } },
        alignment: { horizontal: 'right' }, numFmt: '0.00', border,
      });

      // rows: each entry is { cells: [...], styles: [...] } so cell styles
      // travel with the data as it's built, rather than computed separately
      // by row index afterward.
      const rows = [];
      const push = (cells, styles) => rows.push({ cells, styles: styles || cells.map(() => null) });

      push(['Tektronix, Inc.'], [S.company]);
      push(['Standard Air Contaminant Discharge Permit, Number 34-2638-ST-01'], [S.permit]);
      push(['Annual Air Report'], [S.permit]);
      push([]);
      push(['Calculated PM, PM10, PM2.5, SO2, CO, NOx, VOC, and GHGs 12-month rolling emission rates for each month (permit section 6.3.a.iii)'], [S.subtitle]);
      push([]);

      [...monthKeys].sort().forEach((anchorKey) => {
        const roll = computeRollingAt(anchorKey);
        const startKey = roll.window12[0];
        const endKey = roll.window12[roll.window12.length - 1];
        const spanLabel = roll.window12.length > 1 ? `${monthLabel(startKey)} - ${monthLabel(endKey)}` : monthLabel(endKey);

        push([spanLabel, '', ''], [S.sectionHeader, S.sectionHeader, S.sectionHeader]);
        push(['Criteria Pollutant', 'Actual (tons/yr)', 'Limit (tons/yr)'], [S.colHeaderLabel, S.colHeader, S.colHeader]);
        const pollutantRow = (label, actual, limit) => {
          const pct = limit > 0 ? (actual / limit) * 100 : 0;
          push([label, Number(actual.toFixed(2)), limit], [S.label, actualStyle(pct), S.limit]);
        };
        pollutantRow('Particulates (PM)', roll.pollutantTons.PM, PSEL.PM);
        pollutantRow('Particulates (PM-10)', roll.pollutantTons.PM10, PSEL.PM10);
        pollutantRow('Particulates (PM2.5)', roll.pollutantTons.PM25, PSEL.PM25);
        pollutantRow('Nitrogen Oxides (NOx)', roll.pollutantTons.NOx, PSEL.NOx);
        pollutantRow('Carbon Monoxide (CO)', roll.pollutantTons.CO, PSEL.CO);
        pollutantRow('Sulfur Dioxide (SO-2)', roll.pollutantTons.SO2, PSEL.SO2);
        pollutantRow('Volatile Organic Compounds (VOC)', roll.vocTons, PSEL.VOC);
        pollutantRow('GHGs (CO2e)*', roll.ghgTons, PSEL.GHG);
        if (roll.window12.length < 12) {
          push(['Only ' + roll.window12.length + ' month(s) of data in this window — understates the true annual rate'], [S.note]);
        }
        push([]);
      });

      push(['*GHG expressed in standard tons (2,000 lbs/ton) for PSEL compliance purposes; not metric tonnes as in GHG reporting requirements'], [S.note]);
      push([]);
      push(['Supplementary figures'], [S.title]);
      push(['(not part of the standard monthly table above)'], [S.subtitle]);
      push([]);
      const regPct = (rolling.ghgTonsAllGas / GHG_REGISTRATION_THRESHOLD) * 100;
      push(['GHG — OAR 340-215 registration scope (facility-wide gas incl. Firm Gas), latest month ending ' + monthLabel(latestMonthKey),
        Number(rolling.ghgTonsAllGas.toFixed(2)), GHG_REGISTRATION_THRESHOLD + ' (registration trigger, not a permit limit)'],
        [S.label, actualStyle(regPct), S.limit]);
      const hapPct = (rolling.hapTons / HAP_COMBINED_LIMIT) * 100;
      push(['Combined HAP — Title V major source threshold, latest month ending ' + monthLabel(latestMonthKey),
        Number(rolling.hapTons.toFixed(6)), HAP_COMBINED_LIMIT + ' (not a permit limit)'],
        [S.label, actualStyle(hapPct), S.limit]);
      push([]);
      push(['Per-chemical HAP, rolling 12-month (latest window)'], [S.title]);
      push(['Chemical', 'CAS', 'Tons/yr', 'Single-HAP threshold (tons/yr)'], [S.chemHeader, S.chemHeader, S.chemHeader, S.chemHeader]);
      rolling.chemArr.forEach((c) => push([c.name, c.cas, Number(c.tons.toFixed(6)), HAP_SINGLE_LIMIT], [S.chemRow, S.chemRow, S.chemRow, S.chemRow]));
      push([]);
      push(['Generated by the HAP & VOC Monthly Calculator — verify against your permit before submission.'], [S.note]);

      const aoa = rows.map((r) => r.cells);
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      rows.forEach((r, ri) => {
        r.styles.forEach((style, ci) => {
          if (!style) return;
          const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
          if (!ws[addr]) ws[addr] = { t: 's', v: '' };
          ws[addr].s = style;
        });
      });
      ws['!cols'] = [{ wch: 46 }, { wch: 18 }, { wch: 40 }];
      ws['!freeze'] = { xSplit: 0, ySplit: 6 };
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Annual Air Report');
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

      const downloads = await window.claude.use('downloads');
      if (!downloads) {
        window.alert("This view can't save files directly. Try opening the artifact in a regular browser tab.");
        return;
      }
      const stamp = new Date().toISOString().slice(0, 10);
      await downloads.save({ filename: `Annual_Air_Report_${stamp}.xlsx`, data: blob });
    } catch (e) {
      if (e && e.code === 'declined') return;
      console.error('DEQ export failed', e);
      window.alert('Export failed: ' + ((e && e.message) || 'unknown error'));
    }
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (!parsed || typeof parsed !== 'object') throw new Error('Not a valid backup file');
        const months = {};
        Object.keys(parsed.months || {}).forEach((k) => { months[k] = normalizeMonth(parsed.months[k]); });
        const next = {
          months,
          products: parsed.products || [],
          settings: parsed.settings || JSON.parse(JSON.stringify(GHG_DEFAULTS)),
        };
        persist(next);
        const keys = Object.keys(months).sort();
        setActiveMonth(keys.length ? keys[0] : null);
      } catch (e) {
        console.error('Import failed', e);
        window.alert('That file doesn\'t look like a valid backup — import cancelled.');
      }
    };
    reader.readAsText(file);
  }

  const monthKeys = useMemo(() => Object.keys(data.months).sort(), [data.months]);
  const current = activeMonth ? data.months[activeMonth] : null;

  function addMonth() {
    const now = new Date();
    let key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    if (data.months[key]) {
      // find next month not present
      let y = now.getFullYear(), mo = now.getMonth() + 1;
      while (data.months[key]) {
        mo += 1;
        if (mo > 12) { mo = 1; y += 1; }
        key = y + '-' + String(mo).padStart(2, '0');
      }
    }
    const next = { ...data, months: { ...data.months, [key]: emptyMonth(key) } };
    persist(next);
    setActiveMonth(key);
  }

  function seedYear(year) {
    const months = { ...data.months };
    let firstNew = null;
    for (let mo = 1; mo <= 12; mo++) {
      const key = year + '-' + String(mo).padStart(2, '0');
      if (!months[key]) {
        months[key] = emptyMonth(key);
        if (!firstNew) firstNew = key;
      }
    }
    const next = { ...data, months };
    persist(next);
    setActiveMonth(firstNew || (year + '-01'));
  }

  function seedRollingLookback() {
    // Adds Sept-Dec 2025 -- the four months needed to complete the facility's
    // actual rolling 12-month window (Sept 2025-Aug 2026), matching how the
    // real Emission Factor / Metrics tabs compute their annual figures.
    const keys = ['2025-09', '2025-10', '2025-11', '2025-12'];
    const months = { ...data.months };
    let firstNew = null;
    keys.forEach((key) => {
      if (!months[key]) {
        months[key] = emptyMonth(key);
        if (!firstNew) firstNew = key;
      }
    });
    const next = { ...data, months };
    persist(next);
    if (firstNew) setActiveMonth(firstNew);
  }

  function updateCurrent(patch) {
    if (!activeMonth) return;
    // Audit-trail stamp: just a timestamp, no identity (this app doesn't
    // declare the `user` capability) -- enough to spot a stale or
    // recently-changed month.
    const next = {
      ...data,
      months: { ...data.months, [activeMonth]: { ...current, ...patch, _lastEditedAt: new Date().toISOString() } },
    };
    persist(next);
  }

  function removeMonth(key) {
    const next = { ...data, months: { ...data.months } };
    delete next.months[key];
    persist(next);
    const keys = Object.keys(next.months).sort();
    setActiveMonth(keys.length ? keys[keys.length - 1] : null);
  }

  function bulkImportChemicals(kind, fileRows, mode) {
    const field = kind === 'voc' ? 'vocEntries' : 'hapEntries';
    const months = { ...data.months };
    fileRows.forEach(({ monthKey, entries }) => {
      const base = months[monthKey] ? normalizeMonth(months[monthKey]) : emptyMonth(monthKey);
      const merged = mode === 'add' ? mergeEntries(base[field], entries) : entries;
      months[monthKey] = { ...base, [field]: merged };
    });
    const next = { ...data, months };
    persist(next);
    const touchedKeys = fileRows.map((r) => r.monthKey).sort();
    if (touchedKeys.length) setActiveMonth(touchedKeys[touchedKeys.length - 1]);
  }

  function bulkImportPurchaseRows(perFile, mode) {
    // perFile: [{ monthKey, entries: [{ rawName, rawPart, qty, matchedProduct }] }]
    const products = [...(data.products || [])];
    const newlyCreated = {}; // rawName+rawPart -> product id, so repeats within this batch reuse the same new product

    function resolveProductId(entry) {
      if (entry.matchedProduct) {
        // An existing product that was itself auto-created by an earlier
        // import and never had a real unit set -- this sheet is the first
        // real information we have about what that unit should be, so fill
        // it in now rather than leaving the meaningless placeholder.
        if (entry.needsUnitSetup && entry.rawUnit) {
          const i = products.findIndex((p) => p.id === entry.matchedProduct.id);
          if (i >= 0 && !hasRealUnit(products[i])) {
            products[i] = { ...products[i], unit: entry.rawUnit };
          }
        }
        return entry.matchedProduct.id;
      }
      const dedupeKey = (entry.rawName + '|' + (entry.rawPart || '')).toLowerCase();
      if (newlyCreated[dedupeKey]) return newlyCreated[dedupeKey];
      const id = 'p_' + Date.now() + '_' + Math.round(Math.random() * 1e6);
      products.push({
        // Use the sheet's own unit when we have one, rather than the
        // meaningless placeholder -- and leave weight-per-unit genuinely
        // blank (not a plausible-looking "1") so it's visibly incomplete
        // rather than silently wrong until someone fills in the real
        // conversion from the SDS.
        id, name: entry.rawName, partNumber: entry.rawPart || '', unit: entry.rawUnit || 'unit', weightPerUnitLbs: '',
        confirmedZero: false, confidence: 'unconfirmed',
        notes: 'Auto-added via bulk purchase import — composition not yet researched. Edit this product with real unit, density, and composition once you have SDS data.',
        composition: [],
      });
      newlyCreated[dedupeKey] = id;
      return id;
    }

    const months = { ...data.months };
    perFile.forEach(({ monthKey, entries }) => {
      if (!monthKey || !entries.length) return;
      const base = months[monthKey] ? normalizeMonth(months[monthKey]) : emptyMonth(monthKey);
      const kept = mode === 'replace' ? (base.purchases || []).filter((p) => !p.fromBulkImport) : (base.purchases || []);
      // Merge duplicate products within this same import (e.g. two rows for the same item)
      const qtyByProduct = {};
      const mismatchByProduct = {};
      entries.forEach((e) => {
        const pid = resolveProductId(e);
        qtyByProduct[pid] = (qtyByProduct[pid] || 0) + (Number(e.qty) || 0);
        // Carried through so the flag survives into the Purchases tab itself,
        // not just this import preview -- a unit question doesn't resolve
        // itself just because the dialog closed.
        if (e.unitMismatch) mismatchByProduct[pid] = e.rawUnit;
      });
      const fresh = Object.entries(qtyByProduct).map(([productId, qty]) => ({
        productId, qty, fromBulkImport: true,
        ...(mismatchByProduct[productId] ? { unitMismatch: true, sheetUnit: mismatchByProduct[productId] } : {}),
      }));
      months[monthKey] = { ...base, purchases: [...kept, ...fresh] };
    });

    persist({ ...data, products, months });
    const touchedKeys = perFile.map((r) => r.monthKey).filter(Boolean).sort();
    if (touchedKeys.length) setActiveMonth(touchedKeys[touchedKeys.length - 1]);
  }

  function runCalculations() {
    // Compliance is now a month-independent snapshot, so this no longer needs
    // to move your editing focus — it just takes you to the Compliance tab.
    setTab('compliance');
    setLastCalculated(new Date());
  }

  function addProduct(product) {
    const next = { ...data, products: [...(data.products || []), { ...product, id: 'p_' + Date.now() + '_' + Math.round(Math.random() * 1e6) }] };
    persist(next);
  }

  function updateProduct(id, patch) {
    const next = { ...data, products: (data.products || []).map((p) => (p.id === id ? { ...p, ...patch } : p)) };
    persist(next);
  }

  function removeProduct(id) {
    const next = { ...data, products: (data.products || []).filter((p) => p.id !== id) };
    persist(next);
  }

  // Merging a duplicate: every purchase line across every month that points
  // at one of the merged-away ids gets repointed to the kept product, so
  // past quantities aren't lost -- they just land under the surviving
  // product instead of double-counting as a separate one.
  function mergeProducts(keepId, mergeIds) {
    const mergeSet = new Set(mergeIds);
    const products = (data.products || []).filter((p) => !mergeSet.has(p.id));
    const months = {};
    Object.entries(data.months || {}).forEach(([k, m]) => {
      const purchases = (m.purchases || []).map((pu) => (mergeSet.has(pu.productId) ? { ...pu, productId: keepId } : pu));
      months[k] = { ...m, purchases };
    });
    persist({ ...data, products, months });
  }

  function dismissDuplicateGroup(ids) {
    // Detection checks dismissal pairwise, so dismissing a group of 3+
    // products has to record every pair within it, not one combined key --
    // otherwise a future scan would still catch some of the same pairs.
    const idList = [...ids];
    const newKeys = [];
    for (let i = 0; i < idList.length; i++) {
      for (let j = i + 1; j < idList.length; j++) newKeys.push([idList[i], idList[j]].sort().join('|'));
    }
    const dismissedDuplicates = [...(data.dismissedDuplicates || []), ...newKeys];
    persist({ ...data, dismissedDuplicates });
  }

  function pushPurchasesToTracking() {
    if (!activeMonth || !current) return;
    const contribs = computePurchaseContributions(current.purchases, data.products);
    const vocContribs = contribs.filter((c) => c.kind === 'voc' || c.kind === 'both').map((c) => ({ cas: c.cas, name: c.name, lbs: c.lbs, fromPurchases: true }));
    const hapContribs = contribs.filter((c) => c.kind === 'hap' || c.kind === 'both').map((c) => ({ cas: c.cas, name: c.name, lbs: c.lbs, fromPurchases: true }));
    // Re-pushing replaces only the previously-pushed purchase-derived rows,
    // so it's safe to click again after adding more purchases without
    // double-counting manually entered or bulk-imported chemicals.
    const manualVoc = (current.vocEntries || []).filter((e) => !e.fromPurchases && !e.fromOfficialReport);
    const manualHap = (current.hapEntries || []).filter((e) => !e.fromPurchases && !e.fromOfficialReport);
    updateCurrent({ vocEntries: [...manualVoc, ...vocContribs], hapEntries: [...manualHap, ...hapContribs] });
    setLastCalculated(new Date());
  }

  function pushAllMonthsPurchasesToTracking() {
    // Same logic as pushPurchasesToTracking, but applied to every month at
    // once — "Push" only ever affects the currently active month, so without
    // this, pushing once and switching months looks like nothing happened
    // for the rest of the year.
    const months = { ...data.months };
    Object.keys(months).forEach((monthKey) => {
      const m = normalizeMonth(months[monthKey]);
      const contribs = computePurchaseContributions(m.purchases, data.products);
      const vocContribs = contribs.filter((c) => c.kind === 'voc' || c.kind === 'both').map((c) => ({ cas: c.cas, name: c.name, lbs: c.lbs, fromPurchases: true }));
      const hapContribs = contribs.filter((c) => c.kind === 'hap' || c.kind === 'both').map((c) => ({ cas: c.cas, name: c.name, lbs: c.lbs, fromPurchases: true }));
      const manualVoc = (m.vocEntries || []).filter((e) => !e.fromPurchases && !e.fromOfficialReport);
      const manualHap = (m.hapEntries || []).filter((e) => !e.fromPurchases && !e.fromOfficialReport);
      months[monthKey] = { ...m, vocEntries: [...manualVoc, ...vocContribs], hapEntries: [...manualHap, ...hapContribs] };
    });
    persist({ ...data, months });
    setLastCalculated(new Date());
  }

  function loadResearchedPurchaseData() {
    // Find-or-update each researched product, keyed by its stable sourceKey.
    // Existing products are refreshed in place (unit, density, composition, etc.)
    // rather than left frozen at whatever they were when first added — otherwise
    // any later correction to RESEARCHED_PRODUCTS silently never reaches a
    // library that already has that product in it.
    const products = [...(data.products || [])];
    const idMap = {};
    RESEARCHED_PRODUCTS.forEach((rp) => {
      const idx = products.findIndex((p) => p.sourceKey === rp.key);
      if (idx !== -1) {
        idMap[rp.key] = products[idx].id;
        products[idx] = {
          ...products[idx],
          name: rp.name, partNumber: rp.partNumber, unit: rp.unit,
          weightPerUnitLbs: rp.weightPerUnitLbs, confirmedZero: rp.confirmedZero,
          confidence: rp.confidence, notes: rp.notes, composition: rp.composition,
        };
      } else {
        const id = 'p_' + Date.now() + '_' + Math.round(Math.random() * 1e6) + '_' + rp.key;
        products.push({
          id, sourceKey: rp.key, name: rp.name, partNumber: rp.partNumber, unit: rp.unit,
          weightPerUnitLbs: rp.weightPerUnitLbs, confirmedZero: rp.confirmedZero,
          confidence: rp.confidence, notes: rp.notes, composition: rp.composition,
        });
        idMap[rp.key] = id;
      }
    });

    const months = { ...data.months };
    Object.entries(RESEARCHED_PURCHASES).forEach(([monthKey, items]) => {
      const base = months[monthKey] ? normalizeMonth(months[monthKey]) : emptyMonth(monthKey);
      const keep = (base.purchases || []).filter((p) => !p.fromResearch);
      const fresh = Object.entries(items).map(([sourceKey, qty]) => ({
        productId: idMap[sourceKey], qty, fromResearch: true,
      }));
      months[monthKey] = { ...base, purchases: [...keep, ...fresh] };
    });

    const next = { ...data, products, months };
    persist(next);
    setActiveMonth('2026-08');
    setTab('purchases');
    setLastCalculated(new Date());
  }

  const ghgSettings = data.settings || GHG_DEFAULTS;

  const results = useMemo(() => {
    const out = {};
    // Generator Run Hours depend on the PRIOR month's hourly reading, so
    // walk months in chronological order carrying forward a "last reading"
    // per generator (seeded from the known baselines), exactly like the
    // facility's own GENERATOR RUN LOG carries the prior test's reading
    // forward as this test's starting point.
    const lastReadings = { ...GENERATOR_BASELINE_READINGS };
    [...monthKeys].sort().forEach((k) => {
      const m = normalizeMonth(data.months[k]);
      const genRows = computeGeneratorRunHours(m.generatorDiesel, lastReadings);
      genRows.forEach((g) => {
        if (g.hourlyReading !== '' && g.hourlyReading !== null && g.hourlyReading !== undefined && !isNaN(Number(g.hourlyReading))) {
          lastReadings[g.name] = Number(g.hourlyReading);
        }
      });
      out[k] = computeMonth(data.months[k], ghgSettings, genRows);
    });
    return out;
  }, [data, monthKeys, ghgSettings]);

  function updateGhgSettings(patch) {
    const next = { ...data, settings: { ...ghgSettings, ...patch } };
    persist(next);
  }

  // The Compliance tab is a standing snapshot of where the facility is right
  // now — it anchors to the most recent month that actually has data entered,
  // NOT just the most recent month-key that exists. "Add all of CY2026"
  // creates empty placeholder months for the whole year up front, so without
  // this check the rolling window would silently anchor on a blank month
  // (e.g. December) and drop real earlier months (like the Sept-Dec 2025
  // lookback) right out of the 12-month window.
  function monthHasData(k) {
    const r = results[k];
    if (!r) return false;
    return (r.naturalGasCCF > 0) || (r.boilerDieselGal > 0) || (r.generatorDieselGal > 0)
      || (r.vocUsageLbs > 0) || (r.hapUsageLbs > 0);
  }
  const monthsWithData = monthKeys.filter(monthHasData).sort();
  const latestMonthKey = monthsWithData.length
    ? monthsWithData[monthsWithData.length - 1]
    : (monthKeys.length ? [...monthKeys].sort()[0] : null);

  // Data-completeness scan: flags the kind of gap that's easy to miss month
  // to month -- a month with no fuel entered, no generator readings, or
  // purchases that were logged but never pushed to VOC/HAP tracking -- plus
  // a facility-wide count of products still needing SDS research.
  const dataIssues = useMemo(() => {
    const issues = [];
    // Only flag current or past months -- a future month (e.g. one created
    // by "Add all of CY2026" ahead of time) hasn't happened yet, so it's
    // expected to be empty and shouldn't show as a data-completeness
    // problem until its month actually arrives.
    const now = new Date();
    const todayKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    [...monthKeys].sort().forEach((k) => {
      if (k > todayKey) return;
      const m = data.months[k];
      if (!m) return;
      const r = results[k];
      if (r && r.naturalGasCCFTotal === 0 && r.boilerDieselGal === 0 && r.generatorDieselGal === 0) {
        issues.push({ month: k, tab: 'fuel', text: 'No fuel (gas or diesel) entered for ' + monthLabel(k) });
      }
      const hasGenReading = (m.generatorDiesel || []).some((g) => g.hourlyReading !== '' && g.hourlyReading !== null && g.hourlyReading !== undefined);
      if ((m.generatorDiesel || []).length > 0 && !hasGenReading) {
        issues.push({ month: k, tab: 'generators', text: 'No generator hourly readings entered for ' + monthLabel(k) });
      }
      if ((m.purchases || []).length > 0) {
        const pushed = (m.vocEntries || []).some((e) => e.fromPurchases) || (m.hapEntries || []).some((e) => e.fromPurchases);
        if (!pushed) issues.push({ month: k, tab: 'purchases', text: 'Purchases logged but not yet pushed to VOC/HAP tracking for ' + monthLabel(k) });
      }
    });
    return issues;
  }, [monthKeys, data.months, results]);

  const unconfirmedProductCount = (data.products || []).filter((p) => !p.confirmedZero && p.confidence === 'unconfirmed').length;

  const rolling = useMemo(() => {
    if (!latestMonthKey) return null;
    const window12 = last12Keys(monthKeys, latestMonthKey);
    let vocTons = 0, hapTons = 0, ghgTons = 0, ghgTonsAllGas = 0;
    const pollutantTons = { PM: 0, PM10: 0, PM25: 0, SO2: 0, NOx: 0, CO: 0 };
    const perChem = {};
    window12.forEach((k) => {
      const r = results[k];
      if (!r) return;
      vocTons += r.totalVOCLbs * K;
      hapTons += r.totalHAPLbs * K;
      ghgTons += r.ghgTons;
      ghgTonsAllGas += r.ghgTonsAllGas;
      Object.keys(pollutantTons).forEach((p) => { pollutantTons[p] += r.combustion[p] * K; });
      Object.values(r.hapByChem).forEach((c) => {
        perChem[c.cas] = perChem[c.cas] || { cas: c.cas, name: c.name, tons: 0 };
        perChem[c.cas].tons += c.lbs * K;
      });
    });
    const chemArr = Object.values(perChem).sort((a, b) => b.tons - a.tons);
    return { window12, vocTons, hapTons, ghgTons, ghgTonsAllGas, pollutantTons, chemArr };
  }, [latestMonthKey, monthKeys, results]);

  if (!loaded) {
    return <div style={{ padding: 40, color: '#6B7570', fontFamily: 'ui-sans-serif' }}>Loading calculator…</div>;
  }

  const FONT_HEAD = "'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  const FONT_MONO = "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace";

  return (
    <div style={{ minHeight: '100%', background: '#F5F4F0', fontFamily: FONT_HEAD, color: '#1E2A28' }}>
      {/* Header */}
      <div style={{ background: '#1F4E4B', color: '#F5F4F0', padding: '22px 28px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 11, fontFamily: FONT_MONO, fontWeight: 600, color: '#1F4E4B', background: '#9FC4C0', borderRadius: 4, padding: '3px 8px' }}>
            ACDP 34-2638-ST-01
          </span>
          <span style={{ fontSize: 12, color: '#9FC4C0' }}>Tektronix, Inc. — Howard Vollum Park, Beaverton, OR</span>
        </div>
        <div style={{ fontSize: 22, fontWeight: 600 }}>HAP &amp; VOC Monthly Calculator</div>
        <div style={{ fontSize: 12.5, color: '#C7DEDB', marginTop: 4, maxWidth: 720 }}>
          Material-usage-based monitoring per Permit Condition 5.1(d)–(f) and the PSEL compliance formula of Condition 4.1.
        </div>
        <div style={{ fontSize: 11, color: '#F0C6A8', marginTop: 8, maxWidth: 720 }}>
          Shared copy — data entered here is visible and editable by anyone with this link.
        </div>
        {!dbAvailable && (
          <div style={{ fontSize: 11.5, color: '#fff', background: '#A3312B', marginTop: 10, padding: '7px 10px', borderRadius: 6, maxWidth: 720 }}>
            Changes aren't saving right now — this view may not have edit access, or storage is temporarily unavailable. Anything you enter will be lost on reload unless this resolves. Try "Save Now" in the sidebar, or re-open the artifact link.
          </div>
        )}
      </div>

      <div style={{ display: 'flex', maxWidth: 1180, margin: '0 auto', gap: 22, padding: '22px 20px 60px' }}>
        {/* Sidebar: months */}
        <div className="no-print" style={{ width: 210, flexShrink: 0 }}>
          <button
            onClick={addMonth}
            style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: '#2F6F6B', color: '#fff', border: 'none', borderRadius: 8, padding: '9px 10px', fontSize: 13, fontWeight: 500, cursor: 'pointer', marginBottom: 8 }}
          >
            <Plus size={15} /> Add Month
          </button>

          <button
            onClick={runCalculations}
            disabled={monthKeys.length === 0}
            style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: monthKeys.length ? '#1F4E4B' : '#C8C4B8', color: '#fff', border: 'none', borderRadius: 8, padding: '9px 10px', fontSize: 13, fontWeight: 600, cursor: monthKeys.length ? 'pointer' : 'not-allowed', marginBottom: 4 }}
          >
            <CheckCircle2 size={15} /> Run Calculations
          </button>
          {lastCalculated ? (
            <div style={{ fontSize: 10.5, color: '#8A8F8B', textAlign: 'center', marginBottom: 10 }}>
              Last run {lastCalculated.toLocaleString()}
            </div>
          ) : <div style={{ marginBottom: 10 }} />}

          <div style={{ fontSize: 10.5, textAlign: 'center', marginBottom: 14, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5 }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%', display: 'inline-block',
              background: saveStatus === 'saved' ? '#3F7D4F' : saveStatus === 'error' ? '#A3312B' : '#B3542A',
            }} />
            <span style={{ color: saveStatus === 'error' ? '#A3312B' : '#8A8F8B' }}>
              {saveStatus === 'saved' && 'All changes saved'}
              {saveStatus === 'unsaved' && 'Unsaved changes…'}
              {saveStatus === 'saving' && 'Saving…'}
              {saveStatus === 'error' && 'Save failed — click Save Now'}
            </span>
          </div>

          <CollapsibleCard title="More ways to add months">
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <button
                onClick={() => seedYear(2026)}
                style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: '#fff', color: '#1F4E4B', border: '1px solid #2F6F6B', borderRadius: 8, padding: '8px 10px', fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}
              >
                <Plus size={14} /> Add all of CY2026
              </button>
              <button
                onClick={seedRollingLookback}
                style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: '#fff', color: '#1F4E4B', border: '1px solid #2F6F6B', borderRadius: 8, padding: '8px 10px', fontSize: 12.5, fontWeight: 500, cursor: 'pointer' }}
              >
                <Plus size={14} /> Add Sept–Dec 2025 (rolling lookback)
              </button>
            </div>
          </CollapsibleCard>

          <CollapsibleCard title="Data tools">
            <button
              onClick={saveNow}
              style={{
                width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                background: saveStatus === 'error' ? '#A3312B' : '#fff',
                color: saveStatus === 'error' ? '#fff' : '#1F4E4B',
                border: '1px solid ' + (saveStatus === 'error' ? '#A3312B' : '#2F6F6B'),
                borderRadius: 8, padding: '8px 10px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', marginBottom: 10,
              }}
            >

                const trendPM25 = monthly((r) => r.combustion.PM25 / 2000);
                const trendSO2 = monthly((r) => r.combustion.SO2 / 2000);
                const trendNOx = monthly((r) => r.combustion.NOx / 2000);
                const trendCO = monthly((r) => r.combustion.CO / 2000);
                const trendVOC = monthly((r) => r.totalVOCLbs / 2000);
                const trendGHG = monthly((r) => r.ghgTons);
                const trendGHGAllGas = monthly((r) => r.ghgTonsAllGas);
                const trendHAP = monthly((r) => r.totalHAPLbs / 2000);
                const cardGrid = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 12 };

                return (
                  <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, marginBottom: 16 }}>
                      <div style={{ fontSize: 13, color: '#6B7570' }}>
                        Rolling 12 months ending {monthLabel(latestMonthKey)} &nbsp;
                        {rolling.window12.length < 12 && (
                          <span style={{ color: '#B3542A' }}>
                            (only {rolling.window12.length} month(s) of data — understates the true annual rate)
                          </span>
                        )}
                      </div>
                      <button
                        onClick={exportDeqReport}
                        className="no-print"
                        style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 6, background: '#1F4E4B', color: '#fff', border: 'none', borderRadius: 7, padding: '8px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}
                      >
                        <Upload size={13} /> Export DEQ-style report (.xlsx)
                      </button>
                    </div>

                    <div style={{ fontSize: 12.5, color: '#3A4442', marginBottom: 8, fontWeight: 600, borderLeft: '3px solid #2F6F6B', paddingLeft: 9 }}>Plant site emission limits</div>
                    <div style={cardGrid}>
                      <StatCard label="PM" value={rolling.pollutantTons.PM} limit={PSEL.PM} trendValues={trendPM} />
                      <StatCard label="PM10" value={rolling.pollutantTons.PM10} limit={PSEL.PM10} trendValues={trendPM10} />
                      <StatCard label="PM2.5" value={rolling.pollutantTons.PM25} limit={PSEL.PM25} trendValues={trendPM25} />
                      <StatCard label="SO2" value={rolling.pollutantTons.SO2} limit={PSEL.SO2} trendValues={trendSO2} />
                      <StatCard label="NOx" value={rolling.pollutantTons.NOx} limit={PSEL.NOx} trendValues={trendNOx} />
                      <StatCard label="CO" value={rolling.pollutantTons.CO} limit={PSEL.CO} trendValues={trendCO} />
                      <StatCard label="VOC" value={rolling.vocTons} limit={PSEL.VOC} trendValues={trendVOC} />
                      <StatCard
                        label="GHG (CO2e)" value={rolling.ghgTons} limit={PSEL.GHG} decimals={1} trendValues={trendGHG}
                        note="Boiler-only gas, same scope as the other PSEL pollutants above."
                      />
                    </div>

                    <div style={{ fontSize: 12.5, color: '#3A4442', margin: '22px 0 8px', fontWeight: 600, borderLeft: '3px solid #B3542A', paddingLeft: 9 }}>Title V major source / GHG registration</div>
                    <div style={{ ...cardGrid, gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))' }}>
                      <StatCard
                        label="Combined HAP — Title V threshold" value={rolling.hapTons} limit={HAP_COMBINED_LIMIT} trendValues={trendHAP}
                        note="Not a permit limit — crossing it triggers Title V major-source status for HAPs."
                      />
                      <StatCard
                        label="GHG — OAR 340-215 registration" value={rolling.ghgTonsAllGas} limit={GHG_REGISTRATION_THRESHOLD} decimals={1} trendValues={trendGHGAllGas}
                        note="Not a permit limit — a separate DEQ reporting rule. Facility-wide gas incl. Firm Gas, so don't expect this to match the PSEL figure above."
                      />
                    </div>

                    <div style={{ fontSize: 12.5, color: '#6B7570', margin: '22px 0 8px', fontWeight: 600 }}>Per-chemical HAP, rolling 12-month (tons/yr)</div>
                    {rolling.chemArr.length === 0 && <div style={{ fontSize: 12.5, color: '#8A8F8B' }}>No HAP usage recorded yet.</div>}
                    {rolling.chemArr.slice(0, 10).map((c) => (
                      <LimitBar key={c.cas} label={c.name} value={c.tons} limit={HAP_SINGLE_LIMIT} />
                    ))}
                    {rolling.chemArr.length > 10 && (
                      <div style={{ fontSize: 11.5, color: '#8A8F8B' }}>+ {rolling.chemArr.length - 10} more chemical(s) below reporting threshold</div>
                    )}
                  </div>
                );
              })()}

              <StepNav tab={tab} setTab={setTab} />
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, step = '0.01' }) {
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
      <span style={{ fontSize: 12, color: '#6B7570' }}>{label}</span>
      <input
        type="number" step={step} value={value}
        onChange={(e) => onChange(e.target.value)}
        style={{ border: '1px solid #DCD9D1', borderRadius: 7, padding: '8px 10px', fontSize: 13.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}
      />
    </label>
  );
}

function FuelSourceGroup({ title, rows, valueKey, unitLabel, onChange, onAdd, total, totalLabel }) {
  function updateRow(idx, patch) {
    const next = [...rows];
    next[idx] = { ...next[idx], ...patch };
    onChange(next);
  }
  function removeRow(idx) {
    onChange(rows.filter((_, i) => i !== idx));
  }
  const computedTotal = total !== undefined
    ? total
    : rows.reduce((s, r) => s + (Number(r[valueKey]) || 0), 0);

  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 12.5, fontWeight: 500, color: '#1E2A28', marginBottom: 8 }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {rows.length === 0 && (
          <div style={{ fontSize: 12, color: '#8A8F8B' }}>No sources yet — add one below.</div>
        )}
        {rows.map((r, idx) => (
          <div key={idx} style={{ display: 'grid', gridTemplateColumns: '1fr 130px 28px', gap: 8, alignItems: 'center' }}>
            <input
              value={r.name}
              placeholder="Name (e.g. Boiler 8A, Bldg. 28)"
              onChange={(e) => updateRow(idx, { name: e.target.value })}
              style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 12.5 }}
            />
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <input
                type="number" step="any"
                value={r[valueKey]}
                onChange={(e) => updateRow(idx, { [valueKey]: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace", width: '100%' }}
              />
              <span style={{ fontSize: 11, color: '#8A8F8B' }}>{unitLabel}</span>
            </div>
            <button onClick={() => removeRow(idx)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A', padding: 4 }}>
              <Trash2 size={14} />
            </button>
          </div>
        ))}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
        <button
          onClick={onAdd}
          style={{ display: 'flex', alignItems: 'center', gap: 5, background: '#F0EEE7', border: 'none', borderRadius: 6, padding: '5px 10px', fontSize: 12, cursor: 'pointer', color: '#1F4E4B' }}
        >
          <Plus size={12} /> Add source
        </button>
        <span style={{ fontSize: 12, color: '#6B7570', fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}>
          {totalLabel || 'Total'}: <strong style={{ color: '#1E2A28' }}>{computedTotal.toFixed(2)} {unitLabel}</strong>
        </span>
      </div>
    </div>
  );
}

function GeneratorFuelGroup({ rows, generatorRows, onChange, onAdd, total }) {
  function updateRow(idx, patch) {
    const next = [...rows];
    next[idx] = { ...next[idx], ...patch };
    onChange(next);
  }
  function removeRow(idx) {
    onChange(rows.filter((_, i) => i !== idx));
  }
  const computedByName = {};
  (generatorRows || []).forEach((g) => { computedByName[g.name] = g; });

  const cellIn = { border: '1px solid #DCD9D1', borderRadius: 6, padding: '5px 6px', fontSize: 12, width: '100%', boxSizing: 'border-box' };

  const td = { padding: '4px 5px', verticalAlign: 'middle' };

  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 12.5, fontWeight: 500, color: '#1E2A28', marginBottom: 4 }}>Generator diesel by building</div>

        Enter this month's hour-meter reading — Run Hours and Gal Used calculate automatically, same as the facility log. See field definitions below the table.

      <div className="scroll-x" style={{}}>
        <table style={{ borderCollapse: 'collapse', width: '100%', minWidth: 720 }}>
          <colgroup>
            <col style={{ width: 170 }} />
            <col style={{ width: 105 }} />
            <col style={{ width: 100 }} />
            <col style={{ width: 70 }} />
            <col style={{ width: 70 }} />
            <col style={{ width: 75 }} />
            <col style={{ width: 90 }} />
            <col style={{ width: 30 }} />
          </colgroup>
          <thead>
            <tr>
              <th style={{ ...th, paddingLeft: 10 }}>Building</th>

              <th style={th}>Run hrs</th>
              <th style={th}>Amps</th>
              <th style={th}>% load</th>

                <tr key={idx} style={{ borderTop: '1px solid #F0EEE7' }}>

                  <td style={td}>

                  </td>
                  <td style={td}>
                    <input
                      type="number" step="any" value={r.runHoursOverride}
                      placeholder={computedRunHours === null ? 'n/a' : computedRunHours.toFixed(2)}
                      onChange={(e) => updateRow(idx, { runHoursOverride: e.target.value })}

                  <td style={td}>
                    <input type="number" step="any" value={r.amps} onChange={(e) => updateRow(idx, { amps: e.target.value })}

                  </td>
                  <td style={td}>
                    <input type="number" step="any" value={r.pctLoad} onChange={(e) => updateRow(idx, { pctLoad: e.target.value })}

                  <td style={td}>
                    <input type="number" step="any" value={r.galPerHr} onChange={(e) => updateRow(idx, { galPerHr: e.target.value })}

                  <td style={{ ...td, textAlign: 'right', fontFamily: "'IBM Plex Mono', ui-monospace, monospace", fontSize: 12, color: '#1E2A28' }}>
                    {galUsed.toFixed(2)}
                  </td>
                  <td style={td}>
                    <button onClick={() => removeRow(idx)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A', padding: 2, display: 'flex' }}>

        </table>
      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
        <button
          onClick={onAdd}
          style={{ display: 'flex', alignItems: 'center', gap: 5, background: '#F0EEE7', border: 'none', borderRadius: 6, padding: '5px 10px', fontSize: 12, cursor: 'pointer', color: '#1F4E4B' }}
        >
          <Plus size={12} /> Add generator
        </button>
        <span style={{ fontSize: 12, color: '#6B7570', fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }}>
          Total: <strong style={{ color: '#1E2A28' }}>{total.toFixed(2)} gal</strong>
        </span>
      </div>
      <div style={{ fontSize: 10, color: '#8A8F8B', marginTop: 4 }}>
        Run Hours auto-calculates from the hourly reading change since last month (shown as the field's placeholder) — type a value directly to override it (e.g. if the reading's unavailable but the log states hours directly, or the meter was reset/replaced). An overridden field is outlined and shaded to flag it's manual, not calculated. Clear it to go back to auto. "n/a" means there's no prior reading to compare against yet and nothing's been entered manually — Gal Used falls back to 0 until one exists.
      </div>
    </div>
  );
}

function emptyComposition() { return { cas: '', name: '', kind: 'voc', pct: '' }; }
function emptyProductDraft() {
  return {
    name: '', partNumber: '', unit: 'lb', weightPerUnitLbs: 1,
    confirmedZero: false, confidence: 'unconfirmed', notes: '',
    composition: [],
  };
}

function ProductForm({ initial, onSave, onCancel }) {
  const [draft, setDraft] = useState(initial || emptyProductDraft());

  function patch(p) { setDraft((d) => ({ ...d, ...p })); }
  function patchComp(idx, p) {
    const arr = [...draft.composition]; arr[idx] = { ...arr[idx], ...p };
    patch({ composition: arr });
  }
  function addComp(chem) {
    patch({ composition: [...draft.composition, { cas: chem.cas, name: chem.name, kind: chem.kind, pct: '' }] });
  }
  function removeComp(idx) {
    patch({ composition: draft.composition.filter((_, i) => i !== idx) });
  }

  return (
    <div style={{ border: '1px solid #E6E3DA', borderRadius: 10, padding: 16, background: '#FBFAF7', marginBottom: 16 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11.5, color: '#6B7570' }}>Product name</span>
          <input value={draft.name} onChange={(e) => patch({ name: e.target.value })}
            style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 13 }} />
        </label>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11.5, color: '#6B7570', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            Part number (optional)
            {draft.name && (
              <a
                href={`https://www.google.com/search?q=${encodeURIComponent([draft.name, draft.partNumber, 'safety data sheet SDS'].filter(Boolean).join(' '))}`}
                target="_blank" rel="noopener noreferrer"
                style={{ fontSize: 10.5, color: '#2F6F6B', fontWeight: 600, textDecoration: 'none' }}
              >
                Look up SDS ↗
              </a>
            )}
          </span>
          <input value={draft.partNumber} onChange={(e) => patch({ partNumber: e.target.value })}
            style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 13 }} />
        </label>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11.5, color: '#6B7570' }}>Purchase unit label (e.g. "pail (50 lb)", "tube", "drum")</span>
          <input value={draft.unit} onChange={(e) => patch({ unit: e.target.value })}
            style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 13 }} />
        </label>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11.5, color: '#6B7570' }}>Weight per unit (lb)</span>
          <input type="number" step="any" value={draft.weightPerUnitLbs} onChange={(e) => patch({ weightPerUnitLbs: e.target.value })}
            style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '6px 9px', fontSize: 13, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }} />
        </label>
      </div>

      <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginBottom: 12 }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5 }}>
          <input type="checkbox" checked={draft.confirmedZero} onChange={(e) => patch({ confirmedZero: e.target.checked, composition: e.target.checked ? [] : draft.composition })} />
          Confirmed zero (no tracked VOC/HAP content)
        </label>
        {!draft.confirmedZero && (
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12.5 }}>
            Confidence:
            <select value={draft.confidence} onChange={(e) => patch({ confidence: e.target.value })}
              style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '4px 7px', fontSize: 12 }}>
              {Object.entries(CONFIDENCE_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </label>
        )}
      </div>

      {!draft.confirmedZero && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 6 }}>Composition (% by weight of tracked substances)</div>
          <ChemPicker list={COMBINED_LIST} onAdd={addComp} placeholder="Search VOC/HAP chemical to add to composition…" />
          {draft.composition.map((c, idx) => (
            <div key={idx} style={{ display: 'grid', gridTemplateColumns: '1fr 70px 60px 28px', gap: 8, alignItems: 'center', padding: '6px 0', borderBottom: '1px solid #F0EEE7' }}>
              <div style={{ fontSize: 12.5 }}>{c.name} <span style={{ fontSize: 10.5, color: '#8A8F8B' }}>({c.kind === 'both' ? 'VOC+HAP' : c.kind.toUpperCase()})</span></div>
              <input type="number" step="any" value={c.pct} placeholder="%"
                onChange={(e) => patchComp(idx, { pct: e.target.value })}
                style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '5px 7px', fontSize: 12.5, fontFamily: "'IBM Plex Mono', ui-monospace, monospace" }} />
              <span style={{ fontSize: 11, color: '#8A8F8B' }}>wt %</span>
              <button onClick={() => removeComp(idx)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: '#B3542A' }}>
                <Trash2 size={13} />
              </button>
            </div>
          ))}
        </div>
      )}

      <label style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 14 }}>
        <span style={{ fontSize: 11.5, color: '#6B7570' }}>Notes (e.g. SDS source, confidence rationale)</span>
        <textarea value={draft.notes} onChange={(e) => patch({ notes: e.target.value })} rows={2}
          style={{ border: '1px solid #DCD9D1', borderRadius: 6, padding: '7px 9px', fontSize: 12.5, fontFamily: 'inherit', resize: 'vertical' }} />
      </label>

      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={() => onSave(draft)} disabled={!draft.name.trim()}
          style={{ background: draft.name.trim() ? '#2F6F6B' : '#C8C4B8', color: '#fff', border: 'none', borderRadius: 7, padding: '8px 14px', fontSize: 12.5, cursor: draft.name.trim() ? 'pointer' : 'not-allowed' }}>
          Save product
        </button>
        <button onClick={onCancel} style={{ background: 'none', border: '1px solid #DCD9D1', borderRadius: 7, padding: '8px 14px', fontSize: 12.5, cursor: 'pointer', color: '#6B7570' }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

function ProductLibraryTab({ products, onAdd, onUpdate, onRemove, onLoadResearched, dismissedDuplicates, onMerge, onDismissDuplicates }) {
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [q, setQ] = useState('');
  const [onlyNeedsReview, setOnlyNeedsReview] = useState(false);
  const duplicateGroups = useMemo(
    () => findPossibleDuplicateGroups(products, dismissedDuplicates),
    [products, dismissedDuplicates]
  );

  const needsReview = (p) => !p.confirmedZero && p.confidence !== 'confirmed';
  const counts = {
    confirmed: products.filter((p) => p.confirmedZero || p.confidence === 'confirmed').length,
    likely_zero: products.filter((p) => !p.confirmedZero && p.confidence === 'likely_zero').length,
    unconfirmed: products.filter((p) => !p.confirmedZero && p.confidence === 'unconfirmed').length,
  };

  const filtered = products.filter((p) => {
    if (onlyNeedsReview && !needsReview(p)) return false;
    if (!q.trim()) return true;
    const s = q.toLowerCase();
    return p.name.toLowerCase().includes(s) || (p.partNumber || '').toLowerCase().includes(s);
  });

  return (
    <div style={{ background: '#fff', border: '1px solid #E6E3DA', borderRadius: 12, padding: 20 }}>
      <div style={{ fontSize: 13.5, fontWeight: 500, marginBottom: 6 }}>Product Library</div>
      <div style={{ fontSize: 11.5, color: '#8A8F8B', marginBottom: 14 }}>
        Reference data for each product's tracked VOC/HAP content. Log monthly quantities on the Purchases tab — edit a flagged product right from there, or come here for bulk research and the full catalog.
      </div>

      <div style={{ border: '1px solid #E6C9B8', background: '#FBFAF7', borderRadius: 10, padding: 14, marginBottom: 16 }}>
        <div style={{ fontSize: 12.5, fontWeight: 500, color: '#8A5A2E', marginBottom: 8 }}>
          Monthly checklist — new procurement spreadsheets
        </div>
        <ol style={{ fontSize: 11.5, color: '#3A4442', margin: 0, paddingLeft: 18, lineHeight: 1.6 }}>
          <li>Upload this month's 1–3 procurement spreadsheets here in chat, same as before.</li>
          <li>Claude adds any brand-new products to the library (starting as "unconfirmed") and logs that month's quantities on the Purchases tab.</li>
          <li>Check the count below — anything under "unconfirmed" or "likely zero" is a candidate for real SDS research. Send SDS PDFs for those (or ask Claude to search) to get them confirmed.</li>
          <li>Once composition is settled, go to that month's Purchases tab and click "Push to VOC & HAP tracking" (or "Push ALL months" if you're catching up several at once).</li>
        </ol>
      </div>

      {products.length > 0 && (
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 14, flexWrap: 'wrap' }}>
